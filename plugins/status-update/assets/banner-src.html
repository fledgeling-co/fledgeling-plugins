<!doctype html>
<meta charset="utf-8">
<title>status-update banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&display=swap">
<!--
  Derived from assets/build_icon.py. Every ratio below is that file's own
  constants at k = 0.36, and every colour is one of its named values:

    BX0, BX1, BY0, BY1 : the board slab proportion and geometry
    SETTLED_Y0, SETTLED_Y1 : the unlit claim row at 112 height
    APERTURE_Y0, APERTURE_Y1 : the uncovered confession row at 188 height (1.68x)
    GROUND_TOP/BOT, VIGNETTE : the family's warm porcelain
    G_LIT/SHADE/DEEP, G_TOP : the warm graphite ramp
    EMBER_DEEP/EMBER/EMBER_MID/EMBER_CORE : the one ember
    WARM_SHADOW : contact shadow pool

  The signature move is that the correction is given more room than the claim,
  and the flap has tipped forward out of the plane of the board, breaking its
  silhouette. The settled row stays dark and unlit; the one line being taken back
  burns warm.

  Wordmark is Familjen Grotesk, matching reckon and warrant in the "knowing
  where things stand" group. Its tight apertures and deliberate geometry hold
  at display size.

  Artwork is the real icon.png downscaled to 2x its display size and inlined as
  a data URI, because a file:// page here does not fetch file:// subresources
  and fails silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(138,122,98,0) 58%, rgba(138,122,98,.24) 100%),
      linear-gradient(163deg, #F8F5EE 0%, #E4DDCB 100%);
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; gap: 60px;
    padding: 0 96px; overflow: hidden; position: relative;
  }

  .icon { width: 272px; height: 272px; flex: none; }

  .content { max-width: 680px; z-index: 2; }

  h1 { font-size: 82px; font-weight: 700; letter-spacing: -.032em; line-height: 1;
       color: #221E18; }
  /* the warm mark on the hyphen and update, representing the confession */
  h1 span { color: #5A5449; }
  h1 i { font-style: normal; color: #DE5A28; }

  p { margin-top: 24px; font-size: 25px; line-height: 1.42; max-width: 640px;
      font-weight: 400; color: #5A5449; }
  p b { color: #221E18; font-weight: 500; }

  /* ---- the split-flap board at bench scale -------------------------------
     k = 0.44 scale. Board size 242x185 hung at the right */
  .bench { position: absolute; right: 90px; top: 135px; width: 340px; height: 250px; }

  /* Contact shadow under board */
  .bench-shadow {
    position: absolute; bottom: 20px; left: 30px; width: 250px; height: 38px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(62,42,24,.38), rgba(62,42,24,.10) 65%, rgba(62,42,24,0));
  }
  .floor-ember {
    position: absolute; bottom: 15px; left: 20px; width: 270px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(245,143,74,.25), rgba(222,90,40,.08) 60%, rgba(222,90,40,0));
  }

  .board {
    position: absolute; left: 40px; top: 25px; width: 236px; height: 180px;
    border-radius: 20px;
    background: linear-gradient(135deg, #645D4F 0%, #5A5449 34%, #332E27 78%, #221E18 100%);
    box-shadow: 18px -12px 0 #4C463B; /* the 3D extrusion */
    padding: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* The settled row: cold, unlit */
  .row-settled {
    width: 100%; height: 46px; border-radius: 6px;
    background: linear-gradient(180deg, #17130F 0%, #241F19 62%, #2E2820 100%);
    border-bottom: 1px solid rgba(255,253,248,.16);
    position: relative;
  }
  .row-settled::before {
    content: ""; position: absolute; left: 14px; top: 18px; width: 110px; height: 10px;
    border-radius: 3px; background: #3B352C; opacity: .7;
  }

  /* The aperture: 1.68x taller, warm ember interior */
  .row-aperture {
    width: 100%; height: 80px; border-radius: 6px;
    background: linear-gradient(180deg, #BC3A14 0%, #DE5A28 30%, #F58F4A 72%, #FFD9A8 100%);
    position: relative; overflow: visible;
  }

  /* The flap mid-turn, falling forward out of the plane */
  .flap {
    position: absolute; left: -12px; right: -12px; top: 38px; height: 50px;
    background: linear-gradient(135deg, #7C7466 0%, #5E5749 42%, #3B352C 100%);
    transform: perspective(200px) rotateX(-28deg);
    transform-origin: top center;
    border-radius: 4px;
    border-top: 2px solid rgba(255,217,168,.75); /* bounce from well */
    border-bottom: 2px solid #2E241A;
    box-shadow: 0 10px 16px rgba(62,42,24,.45);
  }
</style>
