<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }

  /* Porcelain register, matching the icon and the daylight half of the family
     (mac-doctor, armada-sync, create-mac-icon). The dark ground belongs to trawl. */
  body { width: 1600px; height: 520px; overflow: hidden; position: relative;
         background:
           radial-gradient(130% 190% at 22% 34%, #fdfcfa 0%, #f4f0e9 44%, #e8e2d7 78%, #ddd6c9 100%);
         font-family: "Schibsted Grotesk", -apple-system, sans-serif; }

  /* The motif is the icon's chain continued off-canvas to the right: links receding
     and fading, and one pair still parted with the weld lit between them. Reads as
     a chain being made whole again rather than as decoration, which is the whole
     claim of the skill. */
  svg.chain { position: absolute; inset: 0; }

  .lockup { position: absolute; left: 148px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 68px; }
  .words { padding-bottom: 10px; }
  .wordmark { font-size: 96px; font-weight: 700; letter-spacing: -0.038em;
              line-height: 1; color: #2f343e; white-space: nowrap; }
  .wordmark .hyphen { color: #e0491f; }
  .tagline { margin-top: 26px; font-size: 30px; font-weight: 400;
             letter-spacing: .002em; color: #6f7683; }
  .tagline b { color: #2f343e; font-weight: 500; }

  /* `filter: drop-shadow(...)` is accepted by the capture engine and never painted,
     so the shadow rides on a rounded rect seated behind the icon instead. The radius
     matches the shared squircle's optical corner. */
  .icon-seat { position: relative; display: inline-block; flex: none; line-height: 0; }
  .icon-shadow { position: absolute; left: 0; top: 0; width: 268px; height: 268px;
                 border-radius: 22.37%; box-shadow: 0 20px 55px rgba(64,58,48,0.127); }
  .icon { position: relative; width: 268px; height: 268px; }
</style>
</head>
<body>
  <svg class="chain" width="1600" height="520" viewBox="0 0 1600 520" fill="none"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fade" x1="1170" y1="0" x2="1700" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0"   stop-color="#8b93a3" stop-opacity=".34"/>
        <stop offset=".55" stop-color="#8b93a3" stop-opacity=".18"/>
        <stop offset="1"   stop-color="#8b93a3" stop-opacity=".05"/>
      </linearGradient>
      <radialGradient id="weld" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#fff3e6" stop-opacity=".95"/>
        <stop offset=".28"  stop-color="#ffe0c4" stop-opacity=".80"/>
        <stop offset=".58"  stop-color="#ff4e18" stop-opacity=".52"/>
        <stop offset="1"    stop-color="#df2700" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Four links marching right, each further from closed. The gap sits at the
         third, where the weld is doing its work. -->
    <g stroke="url(#fade)" stroke-width="18" fill="none">
      <rect x="1198" y="62" width="164" height="84" rx="42"/>
      <rect x="1330" y="62" width="164" height="84" rx="42"/>
      <rect x="1534" y="62" width="164" height="84" rx="42"/>
    </g>

    <!-- the parted pair, and the weld between them -->
    <ellipse cx="1518" cy="104" rx="38" ry="58" fill="url(#weld)"/>
    <circle cx="1518" cy="104" r="8" fill="#fff6ec" opacity=".95"/>
  </svg>
