<!doctype html>
<!--
  Rendered to banner.png at viewport 1600x520, deviceScaleFactor 2 (= 3200x1040).

  Obscura is the only browser used here, and it has two gaps that silently
  degrade this file rather than failing it:
    * remote web fonts never load, so the <link> below is inert at render time.
      Fetch InstrumentSans[wdth,wght].ttf from google/fonts and inline it as a
      data: URI @font-face in a throwaway copy before rendering, or the wordmark
      comes out in a fallback grotesque that no sibling banner uses.
    * `obscura fetch` renders at a fixed 1280x720 with no viewport flag. Use
      `obscura serve` + CDP Emulation.setDeviceMetricsOverride, and check the
      PNG's actual pixel size afterwards — an accepted CDP call proves nothing.
    * no file:// sub-resource loads at all: the icon below reports naturalWidth 0
      and complete false, and the layout still reserves its 288px box, so the
      banner renders looking merely empty. Inline it as a data: URI too.

  One value is calibrated to that engine rather than to the spec: the seal's
  `top`. Obscura places a baseline-aligned inline-block about 60px above where
  Chrome puts it at this font size, so the pill was floating over the cap line.
  Re-rendering in a different engine means re-checking that number by eye.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }

  /* The banner is the same sheet of paper the icon's tile is cut from:
     warm porcelain, cushion-lit, deliberately NOT page-white so it reads
     as a document on GitHub's white and dark grounds alike. */
  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background:
      radial-gradient(120% 150% at 50% -10%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(115% 165% at 50% 50%, rgba(122,112,92,0) 52%, rgba(122,112,92,.16) 100%),
      linear-gradient(178deg, #FAF8F2 0%, #F1EEE4 52%, #E5E1D4 100%);
    font-family: "Instrument Sans", sans-serif;
  }

  /* the record continuing past the right edge: ragged entry lines with
     rounded caps, mirroring the icon's bars, bleeding off the mask boundary
     so the sheet reads as a physical thing rather than a print */
  .ledger { position: absolute; inset: 0; }
  .ledger span {
    position: absolute; right: -60px; height: 13px; border-radius: 7px;
    background: linear-gradient(#5A616D, #434A55 55%, #333944);
    opacity: .20;
  }

  /* the one entry this run stamped, the icon's signature device,
     found again on the far side of the sheet at the same eye level,
     overhanging its neighbours exactly as the seal does in the tile */
  .ledger .seal-row {
    position: absolute; right: -60px; left: 1268px; top: 246px; height: 28px;
    border-radius: 14px;
    background: linear-gradient(#F8845A, #EC5A33 40%, #D33C21 80%, #BB2F17);
    box-shadow: 0 3px 10px rgba(163,52,24,.26)/* inert in this engine, removed: inset 0 1px 0 rgba(255,255,255,.5) */;
  }
  .ledger .seal-row i {
    position: absolute; top: 7px; bottom: 7px; left: 22px; right: 0;
    border-radius: 7px;
    background: linear-gradient(rgba(255,255,255,.96), rgba(255,226,214,.82));
  }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 68px; }
  .icon { width: 288px; height: 288px;
          /* inert in this engine, removed: drop-shadow(0 16px 34px rgba(92,82,64,.26)) */ }

  .wordmark { font-size: 100px; font-weight: 700; letter-spacing: -.035em;
              line-height: 1; color: #2E343D; white-space: nowrap; }

  /* the hyphen in the slug, poured as the seal; the mark's device
     doing the one job a hyphen already does: joining two halves */
  .seal {
    display: inline-block; width: 46px; height: 20px; border-radius: 10px;
    margin: 0 15px; position: relative; top: 34px;
    background: linear-gradient(#F8845A, #EC5A33 40%, #D33C21 80%, #BB2F17);
    box-shadow: 0 2px 7px rgba(163,52,24,.34)/* inert in this engine, removed: inset 0 1px 0 rgba(255,255,255,.55) */;
  }
  .seal i { position: absolute; top: 5px; bottom: 5px; left: 9px; right: 9px;
            border-radius: 5px;
            background: linear-gradient(rgba(255,255,255,.96), rgba(255,226,214,.84)); }

  .tagline { margin-top: 24px; font-size: 26px; font-weight: 400;
             color: #756E60; letter-spacing: .001em; }
  .tagline b { color: #3A414B; font-weight: 500; }
</style>
</head>
