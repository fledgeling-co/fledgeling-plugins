<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Observatory night log</title>
<style>
  :root { --ground: oklch(97% 0.005 250); --muted: oklch(78% 0.02 250); }
  body { background: var(--ground); color: oklch(22% 0.01 250); }
  .caption { color: var(--muted); background: var(--ground); font-size: 13px; }
  .cta { background: oklch(22% 0.01 250); color: oklch(97% 0.005 250); font-size:16px; }
  .cta:hover { background: oklch(30% 0.01 250); }
  .cta:focus-visible { outline: 2px solid oklch(22% 0.01 250); }
</style></head>
<body><div><p class="caption">Seeing 2.1 arcsec</p><button class="cta">Log it</button></div></body></html>
