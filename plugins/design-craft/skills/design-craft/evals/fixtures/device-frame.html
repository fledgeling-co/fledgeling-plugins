<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Onboarding on an iPhone</title>
<style>
  body { background:#F2F0ED; color:#1F1D1B; }
  .cta { background:#1F1D1B; color:#F2F0ED; font-size:16px; }
  .cta:hover { background:#3A3733; }
  .cta:focus-visible { outline:2px solid #1F1D1B; outline-offset:2px; }
</style></head>
<body>
<div class="device" style="
  width:390px; height:844px; margin:40px auto; border-radius:48px;
  /* lint-ok: pure-bw - a phone bezel is genuinely black; this is the device, not a palette choice */
  background:#000; padding:12px; box-shadow:0 30px 60px rgba(0,0,0,.25);">
  <div class="screen" style="width:100%; height:100%; border-radius:38px; overflow:hidden;
       background:#FAFAFA; position:relative;">
    <button class="cta">Get started</button>
  </div>
</div>
</body></html>
