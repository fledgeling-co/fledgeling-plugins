<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Northwind pricing tiers</title>
<style>
  :root { --ink:#1A1A1A; --ground:#FDFCFA; --brand:#E65400; }
  body { background: var(--ground); color: var(--ink); font-family: "Tiempos Text", Georgia, serif; }
  .cta { background: var(--brand); color: #FFFFFF; font-size: 16px; }
  .eyebrow { color: var(--brand); background: var(--ground); font-size: 13px; }
  .cta:hover { background: var(--ink); }
  .cta:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style></head>
<body><p class="eyebrow">Freight</p><button class="cta">Choose Standard</button></body></html>
