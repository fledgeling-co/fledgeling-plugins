<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Tenant two annual review</title>
<style>
  :root { --ink:#1A1A1A; --ground:#FCFBF8; --primary:#D72229; --primary-on-dark:#F6A6A9; }
  body { background:var(--ground); color:var(--ink); }
  .row { opacity: 0; }
  .section.seen .row { animation: fadeUp 650ms ease both; }
  @keyframes fadeUp { to { opacity: 1; } }
  .cta { background:var(--primary); color:#FFFFFF; font-size:20px; font-weight:700; }
  .cta:hover { background:#A61A20; }
  .cta:focus-visible { outline:2px solid var(--primary); }
</style></head>
<body><div class="section"><div class="row">Revenue up 12.4%</div>
<button class="cta">Download</button></div></body></html>
