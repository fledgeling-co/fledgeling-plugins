<!doctype html>
<meta charset="utf-8">
<title>design-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Every value below is lifted from assets/build_icon.py and named in the comment
     that carries it. Nothing here was sampled off a sibling banner.

     Three engine facts this composition works around, measured 2026-08-19:
       filter: drop-shadow() paints nothing here, so the icon's contact shadow is a
         box-shadow on a transparent backing box of the tile's own radius;
       a rotated element that HAS a child renders with tile seams across its
         gradient, so the fan is a flat set of siblings inside a zero-size wrapper,
         each rotated about that wrapper's origin;
       border-radius on a square box draws a squircle rather than a circle, which
         suits a rivet and is why the rivet is left as it is. */

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }

  body {
    /* GROUND_HI / GROUND_MID / GROUND_LO, ramped along the light axis.
       LIGHT_ANGLE_DEG 112 gives LIGHT_AXIS (-0.375, +0.927): the key is up-left,
       so the ground falls toward the shade at atan2(0.375, -0.927) = 158deg. The
       highlight sits at the cushion gradient's own cx 0.44 / cy 0.24, and the
       vignette is GROUND_VIGNETTE at its own 0.24. */
    background:
      radial-gradient(125% 330% at 44% 24%, rgba(255,255,255,.88) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(120% 175% at 50% 50%, rgba(139,127,102,0) 56%, rgba(139,127,102,.24) 100%),
      linear-gradient(158deg, #FDFAF4 0%, #F0EADD 54%, #DCD3C0 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }

  /* ---------------------------------------------------------------- lockup */
  /* SHADE_DIR (+0.375, +0.927) x 40, in SHADOW #3B3327 at cast_front 0.40 stepped
     back to .26 because a banner ground is lit flatter than a tile. Inset 6px
     inside the tile so nothing shows on the up-light side. */
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px;
          border-radius: 58px 58px 58px 58px;
          box-shadow: 15px 37px 38px rgba(59,51,39,.26); }
  .icon { width: 280px; height: 280px; flex: none; }

  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1;
       color: #28200E; }                                  /* SLATE face lo */
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400;
       color: #5E5339; max-width: 604px; }                /* SLATE face hi */
  p b { color: #28200E; font-weight: 500; }

  /* ------------------------------------------------------------- the fan
     Inline SVG rather than CSS boxes, because border-radius on this engine always
     draws a superellipse: a box asked for a circle or an ellipse returns a
     squircle, and the icon's leaves are true capsules. SVG paths, clipPath,
     feDropShadow, feGaussianBlur, masks and userSpaceOnUse gradients all render
     here, so the device below is the icon's own construction rather than a CSS
     impression of it.

     Every path is emitted by build_icon.py's OWN leaf_path(), slab_path() and
     axis_gradient(), against a Spec whose sizes are the icon's scaled by one
     factor of 0.46: leaf_w 238, leaf_len 586, top_r 119, base_taper 0.74,
     thickness 11, pin_r 46. The splay is untouched, so it is literally
     rut_deg -40, opposite_deg -21 and committed_deg +19, a commitment_gap of 40
     degrees. So are the seven layers per leaf, the light axis every ramp hangs
     off, the frost and gel opacities, the specular's spec_w / spec_len, the AO
     tucked under each overlap and the warm bounce the gel throws on the frost.

     placement() centres the fan optically on a square tile; on a 1600x520 bench
     the rivet is placed instead, at the one position that keeps every leaf and
     every cast inside the frame with the fan's mass level with the icon's. */
  .fan { position: absolute; left: 1103px; top: 80px; }
</style>
