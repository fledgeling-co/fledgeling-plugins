<!--
  Every colour below is a named constant out of assets/build_icon.py, so the
  banner and the icon cannot drift apart:

    GROUND_HI/MID/LO, VIGNETTE      the family's warm porcelain tile
    SHELL_HI/MID/LO, SHELL_TOP_*    the warm-neutral graphite drum
    EMBER_CORE/HOT/EMBER/SHADE      the one accent, cut face only
    LAYERS = (.16,.40,.64,.86)      the four strata on the shelf
    TICKS = 10, K = 0.42            gear ticks, and the view foreshortening

  The signature move, held from the icon: the accent appears ONLY on a face
  that a section has opened. Nothing merely orange. The bench reprise at the
  right is the same drum cut twice more, so the row reads as one object being
  opened progressively rather than three ornaments; the leftmost is still
  closed, and it is the only one with no warm face at all. That is the whole
  argument -- you cannot see the mechanism until something cuts it.

  Wordmark is Space Grotesk. Chosen for the numeral: "eli5" ends on a digit at
  display size, and its 5 has a flat spine and an open bowl that stays a 5
  rather than an S. Its drawn-not-written letterforms sit in the technical
  register the icon is already in.

  Artwork is the real icon.png downscaled to 2x its display size and inlined as
  a data URI: a file:// page here does not fetch file:// subresources, and it
  fails silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(156,141,116,0) 58%, rgba(156,141,116,.26) 100%),
      linear-gradient(163deg, #FFFDF7 0%, #F6F1E6 44%, #E2D9C5 100%);
    font-family: "Space Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; gap: 60px;
    padding: 0 96px; overflow: hidden; position: relative;
  }

  /* The icon sits on a backing box carrying a plain box-shadow, because this
     engine accepts filter: drop-shadow() and never paints it -- the banner would
     render shadowless and pass every check. box-shadow spreads about twice the
     ink at the same blur, so the alpha is halved (.20 -> .10) to match. The
     radius is the squircle's at this size: 272 * 0.2245. */
  .iconwrap { width: 272px; height: 272px; flex: none; border-radius: 61px;
              box-shadow: 0 18px 26px rgba(110,92,68,.10); }
  .icon { width: 272px; height: 272px; display: block; }

  h1 { font-size: 96px; font-weight: 700; letter-spacing: -.030em; line-height: 1;
       color: #1D2024; }                                   /* SHELL_LO */
  /* the one warm mark in the type, on the character the icon opens: the last */
  h1 i { font-style: normal; color: #C4622D; }             /* EMBER */

  p { margin-top: 26px; font-size: 26px; line-height: 1.42; max-width: 610px;
      font-weight: 400; color: #5A5449; }
  p b { color: #1D2024; font-weight: 500; }

  /* ---- the bench ------------------------------------------------------
     Inline SVG generated from build_icon.py's own numbers: R 318 -> 52 with
     K 0.42, BODY_H and CUT_D scaled with it, LAYERS at their real fractions.
     CSS ellipses could not hold the section: the warm face ended up stuck on
     the outside of the drum, which says "orange thing" and breaks the one rule
     the icon holds -- accent only on a face a section has opened. */
  .bench { position: absolute; right: 70px; top: 150px; }
</style>
