<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>guide-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* guide-craft banner -- derived directly from assets/build_icon.py constants:
     GROUND_HI=#FDFCF9, GROUND_MID=#F3EFE7, GROUND_LO=#E7E1D5 along 162deg;
     VIGNETTE=#C4B899 @ 0.24 (40% 28%); LIGHT_DX=-0.62, LIGHT_DY=-0.78 -> shadows (+0.62,+0.78);
     COVER_LO=#302D2A, PAGE_HI=#FFFBF3, TAB_MID=#EC6A31 / TAB_LO=#C44D1B (text lifted to #A63812). */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; overflow: hidden; }
  body {
    background:
      radial-gradient(92% 240% at 40% 28%, rgba(196,184,153,0) 58%, rgba(196,184,153,0.24) 100%),
      linear-gradient(162deg, #FDFCF9 0%, #F3EFE7 54%, #E7E1D5 100%);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    position: relative;
    color: #25211E;
  }

  /* Left: real icon asset with light-derived warm shadow */
  .tile-shadow {
    position: absolute;
    left: 118px; top: 132px;
    width: 256px; height: 256px;
    border-radius: 58px;
    box-shadow: 14px 18px 32px rgba(48,45,42,0.16), 4px 5px 10px rgba(48,45,42,0.11);
  }
  .icon {
    position: absolute;
    left: 102px; top: 116px;
    width: 288px; height: 288px;
    display: block;
  }

  /* Centre: wordmark + balanced two-line essence */
  .text {
    position: absolute;
    left: 446px; top: 170px;
    width: 604px;
  }
  .eyebrow {
    font: 500 15px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #A63812;
    margin-bottom: 14px;
  }
  h1 {
    font-family: "Saira Condensed", sans-serif;
    font-size: 102px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 0.92;
    color: #25211E;
  }
  .lead {
    margin-top: 22px;
    font-size: 25px;
    line-height: 1.40;
    font-weight: 400;
    color: #564D43;
    max-width: 584px;
    text-wrap: pretty;
  }
  .lead b {
    color: #25211E;
    font-weight: 600;
  }

  /* Right: folio-inspired single-dataset-to-three-surfaces architectural card stack */
  .diagram {
    position: absolute;
    left: 1098px; top: 112px;
    width: 408px; height: 296px;
  }
  .spine {
    position: absolute;
    left: 0; top: 24px;
    width: 14px; height: 254px;
    border-radius: 7px;
    background: linear-gradient(180deg, #6B645E 0%, #4A4541 50%, #302D2A 100%);
    box-shadow: 3px 4px 8px rgba(48,45,42,0.16);
  }
  .tab-pill {
    position: absolute;
    right: 14px; top: 0;
    padding: 7px 14px;
    border-radius: 8px 8px 2px 2px;
    background: linear-gradient(160deg, #EC6A31 0%, #C44D1B 100%);
    color: #FFFDF9;
    font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    box-shadow: 2px 3px 6px rgba(74,59,44,0.16);
  }
  .cards {
    position: absolute;
    left: 28px; top: 26px;
    width: 372px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: linear-gradient(162deg, #FFFDF9 0%, #F5EFE4 100%);
    border: 1px solid rgba(74,59,44,0.16);
    border-radius: 12px;
    padding: 15px 18px;
    box-shadow: 4px 5px 10px rgba(48,45,42,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card.active {
    border-color: rgba(196,77,27,0.38);
    background: linear-gradient(162deg, #FFFDF9 0%, #FAF1E6 100%);
  }
  .card-title {
    font-family: "Saira Condensed", sans-serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #25211E;
    line-height: 1;
  }
  .card-sub {
    margin-top: 5px;
    font-size: 15px;
    color: #564D43;
    line-height: 1.25;
  }
  .chip {
    font: 500 13px/1 "IBM Plex Mono", ui-monospace, monospace;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(74,59,44,0.08);
    color: #3E3731;
    white-space: nowrap;
  }
  .card.active .chip {
    background: rgba(196,77,27,0.12);
    color: #A63812;
  }
</style>
</head>
