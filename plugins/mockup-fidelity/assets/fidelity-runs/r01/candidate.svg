<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- cushion: never flat. Calibrated to the siblings, not to Apple's ground -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F6EE"/>
      <stop offset=".54" stop-color="#F3EFE4"/>
      <stop offset="1" stop-color="#E4DDCB"/>
    </linearGradient>
    <radialGradient id="vig" cx=".40" cy=".36" r=".80">
      <stop offset=".52" stop-color="#4A3F2E" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A3F2E" stop-opacity=".13"/>
    </radialGradient>

    <linearGradient id="mockFloor" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#F0E9D9"/>
      <stop offset="1" stop-color="#DFD5BE"/>
    </linearGradient>

    <!-- the slab: one key up and to the left, so top-left is the lit corner -->
    <linearGradient id="gel" x1="382.4" y1="272" x2="479.6" y2="812"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A7D64"/>
      <stop offset=".52" stop-color="#6B6049"/>
      <stop offset="1" stop-color="#443A2B"/>
    </linearGradient>
    <!-- the second direction is a second layer, never a lean on the first: a
         gradient carries one axis, and a lateral lean written into a mostly
         vertical vector projects past offset 1 and renders flat (clarify, r-lean) -->
    <linearGradient id="gelSide" x1="539.0" y1="0" x2="836" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3F2E" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A3F2E" stop-opacity=".17"/>
    </linearGradient>
    <!-- a wall ramps COLOUR, not opacity: an opacity ramp dissolves the wall on
         the unlit side and the slab loses its thickness (mac-doctor, r07) -->
    <linearGradient id="gelWall" x1="296" y1="0" x2="836" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B4133"/>
      <stop offset="1" stop-color="#342C21"/>
    </linearGradient>
    <linearGradient id="satin" x1="0" y1="272" x2="0" y2="569.0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFFDF8" stop-opacity="0"/>
    </linearGradient>
    <!-- the gap's light grazing the two faces that look into it, and reaching a
         little way INTO the gel, because the slab is a translucent body -->
    <linearGradient id="bounceTop" x1="0" y1="272" x2="0" y2="422"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F79A61" stop-opacity=".21"/>
      <stop offset="1" stop-color="#F79A61" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bounceLeft" x1="296" y1="0" x2="466" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F79A61" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F79A61" stop-opacity="0"/>
    </linearGradient>
    <!-- a translucent body carries a rim of transmitted light just inside its
         outline; without it a gel slab reads as a lit opaque plane -->
    <linearGradient id="transmit" x1="296" y1="272" x2="674.0" y2="812"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#FFFDF8" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFDF8" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="ao" cx=".82" cy=".86" r=".62">
      <stop offset="0" stop-color="#4A3F2E" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4A3F2E" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="edgeSoft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bloom" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="contact" x="-35%" y="-35%" width="170%" height="190%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="tile"><path d="M1024.00,512.00C1024.00,569.33 1023.85,646.20 1023.56,683.99C1023.27,721.78 1022.83,723.03 1022.24,738.75C1021.66,754.47 1020.92,766.39 1020.04,778.30C1019.16,790.20 1018.13,800.36 1016.95,810.17C1015.77,819.99 1014.44,828.75 1012.95,837.17C1011.47,845.58 1009.83,853.28 1008.04,860.66C1006.25,868.04 1004.30,874.89 1002.19,881.45C1000.08,888.01 997.81,894.14 995.37,900.02C992.94,905.90 990.34,911.43 987.56,916.73C984.79,922.03 981.85,927.02 978.72,931.81C975.59,936.59 972.29,941.11 968.79,945.43C965.29,949.75 961.62,953.83 957.72,957.72C953.83,961.62 949.75,965.29 945.43,968.79C941.11,972.29 936.59,975.59 931.81,978.72C927.02,981.85 922.03,984.79 916.73,987.56C911.43,990.34 905.90,992.94 900.02,995.37C894.14,997.81 888.01,1000.08 881.45,1002.19C874.89,1004.30 868.04,1006.25 860.66,1008.04C853.28,1009.83 845.58,1011.47 837.17,1012.95C828.75,1014.44 819.99,1015.77 810.17,1016.95C800.36,1018.13 790.20,1019.16 778.30,1020.04C766.39,1020.92 754.47,1021.66 738.75,1022.24C723.03,1022.83 721.78,1023.27 683.99,1023.56C646.20,1023.85 569.33,1024.00 512.00,1024.00C454.67,1024.00 377.80,1023.85 340.01,1023.56C302.22,1023.27 300.97,1022.83 285.25,1022.24C269.53,1021.66 257.61,1020.92 245.70,1020.04C233.80,1019.16 223.64,1018.13 213.83,1016.95C204.01,1015.77 195.25,1014.44 186.83,1012.95C178.42,1011.47 170.72,1009.83 163.34,1008.04C155.96,1006.25 149.11,1004.30 142.55,1002.19C135.99,1000.08 129.86,997.81 123.98,995.37C118.10,992.94 112.57,990.34 107.27,987.56C101.97,984.79 96.98,981.85 92.19,978.72C87.41,975.59 82.89,972.29 78.57,968.79C74.25,965.29 70.17,961.62 66.28,957.72C62.38,953.83 58.71,949.75 55.21,945.43C51.71,941.11 48.41,936.59 45.28,931.81C42.15,927.02 39.21,922.03 36.44,916.73C33.66,911.43 31.06,905.90 28.63,900.02C26.19,894.14 23.92,888.01 21.81,881.45C19.70,874.89 17.75,868.04 15.96,860.66C14.17,853.28 12.53,845.58 11.05,837.17C9.56,828.75 8.23,819.99 7.05,810.17C5.87,800.36 4.84,790.20 3.96,778.30C3.08,766.39 2.34,754.47 1.76,738.75C1.17,723.03 0.73,721.78 0.44,683.99C0.15,646.20 0.00,569.33 0.00,512.00C0.00,454.67 0.15,377.80 0.44,340.01C0.73,302.22 1.17,300.97 1.76,285.25C2.34,269.53 3.08,257.61 3.96,245.70C4.84,233.80 5.87,223.64 7.05,213.83C8.23,204.01 9.56,195.25 11.05,186.83C12.53,178.42 14.17,170.72 15.96,163.34C17.75,155.96 19.70,149.11 21.81,142.55C23.92,135.99 26.19,129.86 28.63,123.98C31.06,118.10 33.66,112.57 36.44,107.27C39.21,101.97 42.15,96.98 45.28,92.19C48.41,87.41 51.71,82.89 55.21,78.57C58.71,74.25 62.38,70.17 66.28,66.28C70.17,62.38 74.25,58.71 78.57,55.21C82.89,51.71 87.41,48.41 92.19,45.28C96.98,42.15 101.97,39.21 107.27,36.44C112.57,33.66 118.10,31.06 123.98,28.63C129.86,26.19 135.99,23.92 142.55,21.81C149.11,19.70 155.96,17.75 163.34,15.96C170.72,14.17 178.42,12.53 186.83,11.05C195.25,9.56 204.01,8.23 213.83,7.05C223.64,5.87 233.80,4.84 245.70,3.96C257.61,3.08 269.53,2.34 285.25,1.76C300.97,1.17 302.22,0.73 340.01,0.44C377.80,0.15 454.67,0.00 512.00,0.00C569.33,0.00 646.20,0.15 683.99,0.44C721.78,0.73 723.03,1.17 738.75,1.76C754.47,2.34 766.39,3.08 778.30,3.96C790.20,4.84 800.36,5.87 810.17,7.05C819.99,8.23 828.75,9.56 837.17,11.05C845.58,12.53 853.28,14.17 860.66,15.96C868.04,17.75 874.89,19.70 881.45,21.81C888.01,23.92 894.14,26.19 900.02,28.63C905.90,31.06 911.43,33.66 916.73,36.44C922.03,39.21 927.02,42.15 931.81,45.28C936.59,48.41 941.11,51.71 945.43,55.21C949.75,58.71 953.83,62.38 957.72,66.28C961.62,70.17 965.29,74.25 968.79,78.57C972.29,82.89 975.59,87.41 978.72,92.19C981.85,96.98 984.79,101.97 987.56,107.27C990.34,112.57 992.94,118.10 995.37,123.98C997.81,129.86 1000.08,135.99 1002.19,142.55C1004.30,149.11 1006.25,155.96 1008.04,163.34C1009.83,170.72 1011.47,178.42 1012.95,186.83C1014.44,195.25 1015.77,204.01 1016.95,213.83C1018.13,223.64 1019.16,233.80 1020.04,245.70C1020.92,257.61 1021.66,269.53 1022.24,285.25C1022.83,300.97 1023.27,302.22 1023.56,340.01C1023.85,377.80 1024.00,454.67 1024.00,512.00Z"/></clipPath>
    <clipPath id="mockClip"><rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0"/></clipPath>
    <clipPath id="buildClip"><rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0"/></clipPath>
    <!-- mock MINUS build. A two-subpath clipPath would union them under the
         default nonzero rule, so the subtraction is a mask, not a clip. -->
    <mask id="exposed" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="#fff"/>
      <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#tile)">
    <g id="bg">
      <!-- the cushion, and the ember reaching the porcelain past the scribe -->
      <rect width="1024" height="1024" fill="url(#ground)"/>
      <rect width="1024" height="1024" fill="url(#vig)"/>
      <g filter="url(#bloom)" opacity=".26">
        <g mask="url(#exposed)"><rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="#E4652E"/></g>
      </g>

      <!-- the reference: an area cut into the tile, its groove, its far lit
           wall, and the registration bracket on the corner the build left bare -->
      <rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="url(#mockFloor)"/>
      <g stroke="#8A7A61" fill="none" stroke-linecap="round" opacity=".58">
        <path d="M166 166 h-46" stroke-width="7"/><path d="M166 166 v-46" stroke-width="7"/>
      </g>
      <g clip-path="url(#mockClip)">
        <rect x="193.0" y="193.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#FFFDF8" stroke-width="5" opacity=".60"/>
        <rect x="199.0" y="199.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#8A7A61" stroke-width="5" opacity=".30"/>
      </g>
      <rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#8A7A61" stroke-width="5" opacity=".50"/>
    </g>

    <g id="mid">
      <!-- ABSENT: the exposed reference, lit. Drawn to scale - the strip IS the
           misregistration, so the icon reports the size of the difference. Built
           as a trough: hot against the slab's wall, deepest at the scribed line,
           because one gradient carries one axis and an L has two arms. -->
      <g mask="url(#exposed)">
        <rect x="222.0" y="222.0" width="488.0" height="488.0" rx="61.7" fill="#E4652E"/>
        <g filter="url(#soft)">
          <rect x="222.0" y="222.0" width="488.0" height="488.0" rx="61.7" fill="none" stroke="#B8390F" stroke-width="72" opacity=".92"/>
        </g>
        <g filter="url(#soft)">
          <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#F79A61" stroke-width="46" opacity=".88"/>
        </g>
        <g filter="url(#edgeSoft)">
          <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#FFD3A2" stroke-width="13" opacity=".78"/>
        </g>
        <!-- the light stops inside the reference's own frame, so the scribed
             rectangle stays porcelain and stays legible as the authority -->
        <rect x="222.0" y="222.0" width="488.0" height="488.0" rx="61.7" fill="none" stroke="#8E2E0C" stroke-width="6" opacity=".45"/>
      </g>

      <!-- the overhang's contact shadow, on the porcelain it rides onto -->
      <g filter="url(#contact)" opacity=".33">
        <rect x="306.0" y="312.0" width="540.0" height="540.0" rx="76.0" fill="#4A3F2E"/>
      </g>
    </g>

    <g id="fg">
      <!-- DIVERGENT / PRESENT: the implementation, off register. Its thickness
           is a colour ramp on an opaque wall, not a faded copy of the face. -->
      <rect x="296.0" y="296.0" width="540.0" height="540.0" rx="76.0" fill="url(#gelWall)"/>
      <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="url(#gel)"/>

      <!-- the mock read THROUGH the gel: its floor tone stops exactly at the
           scribed line, and the line, the far wall's catch and the far bracket
           carry on underneath. This is the signature craft moment - authored
           overlap, Tahoe tell 5, and the reason this is a measurement. -->
      <g clip-path="url(#buildClip)">
        <g clip-path="url(#mockClip)">
          <rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="#F0E9D9" opacity=".10"/>
          <rect x="193.0" y="193.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#FFFDF8" stroke-width="5" opacity=".18"/>
        </g>
        <rect x="196.0" y="196.0" width="540.0" height="540.0" rx="76.0" fill="none" stroke="#332C21" stroke-width="6" opacity=".46"/>
        <g stroke="#332C21" fill="none" stroke-linecap="round" opacity=".38">
          <path d="M766 766 h46" stroke-width="7"/><path d="M766 766 v46" stroke-width="7"/>
        </g>
      </g>
    </g>

    <g id="highlight">
      <!-- lighting only: droppable without the mark stopping being itself -->
      <g clip-path="url(#buildClip)">
        <rect x="296.0" y="272.0" width="540.0" height="297.0" rx="76.0" fill="url(#satin)"/>
        <rect x="296.0" y="272.0" width="540.0" height="150.0" rx="76.0" fill="url(#bounceTop)"/>
        <rect x="296.0" y="272.0" width="170.0" height="540.0" rx="76.0" fill="url(#bounceLeft)"/>
        <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="url(#gelSide)"/>
        <rect x="296.0" y="272.0" width="540.0" height="540.0" rx="76.0" fill="url(#ao)"/>
        <!-- transmitted rim: a stroke on the inside of the outline, so the body
             reads as gel rather than as a lit opaque plane -->
        <rect x="303.0" y="279.0" width="526.0" height="526.0" rx="69.0" fill="none"
              stroke="url(#transmit)" stroke-width="13"/>
      </g>
      <path d="M372 277 H760" stroke="#FFFDF8" stroke-width="8"
            stroke-linecap="round" opacity=".38"/>
      <path d="M301 348 V736" stroke="#FFD3A2" stroke-width="7"
            stroke-linecap="round" opacity=".30"/>
      <path d="M831 348 V736" stroke="#4A3F2E" stroke-width="7"
            stroke-linecap="round" opacity=".22"/>
