<!doctype html>
<meta charset="utf-8">
<title>mockup-fidelity banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    /* GROUND_TOP / GROUND_MID / GROUND_BOT */
    background: linear-gradient(158deg, #F9F6EE 0%, #F3EFE4 52%, #E4DDCB 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 96px; overflow: hidden; position: relative;
  }
  .icon { width: 268px; height: 268px; flex: none;
          /* inert in this engine, removed: drop-shadow(0 22px 44px rgba(74,63,46,.24)) */ }   /* SHADOW */
  h1 { font-size: 70px; font-weight: 600; letter-spacing: -.03em;
       color: #332C21; line-height: 1; }                            /* GEL_DEEP */
  .rule { width: 64px; height: 3px; background: #E4652E;            /* ACCENT */
          margin: 26px 0 22px; border-radius: 2px; }
  p { font-size: 25px; line-height: 1.42; color: #6B6049;           /* GEL_MID */
      max-width: 600px; font-weight: 400; }
  p b { color: #332C21; font-weight: 600; }

  /* The signature move, drawn to scale: the reference scribed into the ground,
     the implementation laid over it, misregistered by the same (100,76) the icon
     uses, and the exposed sliver carrying the only chroma on the page. */
  .reg { position: absolute; right: 150px; top: 126px; width: 300px; height: 256px; }
  .scribe { position: absolute; inset: 0; border: 2px dashed #8A7A61;  /* SCRIBE */
            border-radius: 26px; }
  .slab { position: absolute; left: 50px; top: 38px; right: -12px; bottom: -20px;
          border-radius: 26px;
          background: linear-gradient(168deg, #8A7D64 0%, #6B6049 58%, #443A2B 100%);
          box-shadow: 0 18px 34px rgba(74,63,46,.30); }
  .sliver { position: absolute; left: 0; top: 0; width: 50px; height: 256px;
            border-radius: 26px 0 0 26px;
            background: linear-gradient(180deg, #F79A61 0%, #E4652E 46%, #B8390F 100%); }
  .offset { position: absolute; left: 0; top: 276px; width: 360px; white-space: nowrap;
            font: 500 15px/1.4 "IBM Plex Mono", ui-monospace, monospace;
            color: #8A7A61; letter-spacing: .04em; }
</style>
<div class="reg">
  <div class="sliver"></div>
  <div class="scribe"></div>
  <div class="slab"></div>
  <div class="offset">divergent &middot; offset 100,76</div>
</div>
