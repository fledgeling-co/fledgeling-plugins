<!doctype html>
<meta charset="utf-8">
<title>visualization banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<!--
  Every colour below is a named constant out of assets/build_icon.py, not a
  sampled approximation:

    GRAPHITE_MID  #262E37   the bar bodies, and the wordmark
    GRAPHITE_TOP  #59636E   the bars' top-lit edge, and the body copy
    RULE_MID      #E85F22   the lit baseline, and the one warm mark in the type
    RULE_BODY     #C43F16   the rule's deeper body, for the gradient's far end
    RULE_HOT      #FF9A4E   where the rule is brightest
    #F7F6F3 / #E6E4E0       the porcelain ground, top to bottom

  The bench figure at the right restates the icon's argument at banner scale:
  three bars of unequal height (BAR_H 300/430/206, BAR_W 132, BAR_GAP 78, scaled
  k=0.30) standing ON the rule rather than floating above it, and the rule runs
  RULE_OVERHANG past the outermost bar on each side so the bars never define its
  extent. BAR_SINK presses each bar 4px into the rule, so no hairline seam
  survives between them, which is the whole point: the baseline is not a
  decoration under the bars, it is what makes their lengths mean anything.

  The bars are deliberately drawn WITHOUT their own baseline rule underneath.
  Give each bar its own footing and the figure becomes three objects that happen
  to be aligned; the single shared rule is what says they are comparable.

  Artwork is the real icon.png (the 1024 render), inlined as a data URI, because
  a file:// page does not fetch file:// subresources and fails silently.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(0,0,0,0) 62%, rgba(0,0,0,.06) 100%),
      linear-gradient(180deg, #FFFFFF 0%, #F7F6F3 55%, #E6E4E0 100%);
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 92px; overflow: hidden; position: relative;
  }

  .icon { width: 272px; height: 272px; flex: none; }

  /* The wordmark stands on its own lit rule, which is the icon's argument
     restated in type: the bars mean something because of what they stand on, and
     so does the word. Two orange letters was the earlier version and it was
     decoration, because no reason picked those letters over any others. */
  .mark { display: inline-block; padding-bottom: 16px; position: relative; }
  h1 { font-size: 88px; font-weight: 700; letter-spacing: -.038em; line-height: 1;
       color: #262E37; white-space: nowrap; }
  .mark::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0;
                 height: 9px; border-radius: 2.5px;
                 background: linear-gradient(180deg, #FF9A4E 0%, #E85F22 42%, #C43F16 100%); }

  p { margin-top: 30px; font-size: 26px; line-height: 1.42; max-width: 590px;
      font-weight: 400; color: #59636E; }
  p b { color: #262E37; font-weight: 500; }

  /* ---- the bench figure: the icon's own geometry at k = 0.30 -------------- */
  .bench { position: absolute; right: 74px; top: 138px; width: 268px; height: 244px; }
  .bar { position: absolute; bottom: 15.6px; width: 39.6px;
         border-radius: 9px 9px 0 0;
         background: linear-gradient(180deg, #59636E 0%, #39424C 26%, #262E37 68%, #1A2027 100%); }
  .b1 { left: 44px;    height: 90px; }
  .b2 { left: 127.6px; height: 129px; }
  .b3 { left: 211.2px; height: 61.8px; }
  .rule { position: absolute; bottom: 0; left: 12.8px; width: 242.4px; height: 15.6px;
          border-radius: 3.6px;
          background: linear-gradient(180deg, #FF9A4E 0%, #E85F22 42%, #C43F16 100%); }
  .glow { position: absolute; bottom: -14px; left: -6px; width: 280px; height: 46px;
          border-radius: 50%; background: rgba(232,95,34,.18); filter: blur(11px); }
</style>
