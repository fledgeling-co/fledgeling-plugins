<!doctype html>
<meta charset="utf-8">
<title>deck-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Every value below is lifted from assets/build_icon.py and named in the comment
     that carries it. Nothing here was sampled off a sibling banner.

     Engine facts this composition works around, measured 2026-08-19:
       filter: drop-shadow() paints nothing here, so the tile's contact shadow is a
         box-shadow on a transparent backing box, which suits a squircle tile;
       a rotated CSS box that has a child renders with tile seams across its
         gradient, and Spec.tilt rotates the whole deck, so the deck is inline SVG
         where a transform is a coordinate change rather than a raster pass. */

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }

  body {
    /* GROUND_HI / GROUND_MID / GROUND_LO, ramped along the light axis.
       LIGHT_ANGLE_DEG 118 gives LIGHT_AXIS (-0.47, +0.88): the key is upper left,
       so the ground falls toward the shade at atan2(0.47, -0.88) = 152deg. The
       highlight sits at the cushion gradient's own cx 0.40 / cy 0.28, and the
       vignette is GROUND_VIGNETTE at its own 0.26. */
    background:
      radial-gradient(122% 325% at 40% 28%, rgba(255,255,255,.88) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(120% 175% at 50% 50%, rgba(139,127,102,0) 56%, rgba(139,127,102,.26) 100%),
      linear-gradient(152deg, #FCFAF4 0%, #F3EDE1 56%, #DED5C2 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }

  /* ---------------------------------------------------------------- lockup */
  /* The shade direction (+0.47, +0.88) x 40, in SHADOW #3B3327. Inset 6px inside
     the tile so nothing shows on the up-light side. */
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px;
          border-radius: 58px 58px 58px 58px;
          box-shadow: 19px 35px 38px rgba(59,51,39,.26); }
  .icon { width: 280px; height: 280px; flex: none; }

  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1;
       color: #241E13; }                     /* the leading plate's seat edge */
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400;
       color: #413929; max-width: 604px; }   /* the leading plate's face lo */
  p b { color: #241E13; font-weight: 500; }

  /* ------------------------------------------------------- the running order
     Emitted by build_icon.py's own rounded() and Spec, at one scale factor of
     0.53. PLATE_ASPECT still cuts every plate to the same 16:9 stage, Spec.step_x
     112 and step_y 76 still carry the sequence, Spec.tilt -3 still tips the whole
     deck, and PLATE_FACES still runs the leading plate as warm graphite gel with
     the rest of the deck receding in frosted porcelain, one value step flatter
     each time. The order is carried by value and position rather than by hue,
     which is what keeps it legible in grayscale and under a system tint.

     The title band is Spec.rule_top 0.335 and rule_h 0.115 of the plate height, at
     the same place on every single face, with the same ACCENT_HI lip and the same
     warm bloom beneath it. Read front to back it climbs, and that climb IS the
     running order: re-order a plate and the climb breaks. */
  .deck { position: absolute; left: 1080px; top: 83px; }
</style>
