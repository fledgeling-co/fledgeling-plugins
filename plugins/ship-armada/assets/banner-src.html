<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  /* Instrument Sans: a face drawn for instrumentation, because the artifact this
     names is a plotting instrument. Not a silent default. */
  body { width: 1600px; height: 520px; overflow: hidden; position: relative;
         background: radial-gradient(120% 165% at 30% 34%, #F5EEE0 0%, #EFE6D5 44%, #E4D8C2 82%, #DCCFB6 100%);
         font-family: "Instrument Sans", sans-serif; }
  svg.chart { position: absolute; inset: 0; }
  .lockup { position: absolute; left: 132px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 76px; }
  /* the icon lies ON the chart table: the system shadow is what separates a
     vellum plate from a vellum ground */
  .icon { width: 320px; height: 320px;
          filter: drop-shadow(0 22px 40px rgba(96, 76, 48, .30))
                  drop-shadow(0 4px 10px rgba(96, 76, 48, .18)); }
  .words { padding-bottom: 6px; }
  .wordmark { font-size: 112px; font-weight: 700; letter-spacing: -0.035em;
              line-height: 1; color: #333E48; display: flex; align-items: center; }
  /* a plotted fix: chart language for "this is our position". The only accent
     outside the icon itself. */
  .fix { width: 30px; height: 30px; margin-left: 22px; border-radius: 50%;
         border: 4px solid #D63A20; display: flex; align-items: center;
         justify-content: center; flex: none; }
  .fix i { width: 9px; height: 9px; border-radius: 50%; background: #D63A20; }
  .tagline { margin-top: 26px; font-size: 30px; font-weight: 400;
             letter-spacing: .002em; color: #5A6570; }
  .tagline b { color: #2E3841; font-weight: 600; }
  .tagline code { font-family: ui-monospace, "SF Mono", Menlo, monospace;
                  font-size: 27px; color: #47525C; letter-spacing: -.01em; }
</style>
</head>
