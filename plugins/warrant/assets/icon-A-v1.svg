      <stop offset="0.50" stop-color="#F6F4EF"/>
      <stop offset="1"    stop-color="#E5E0D6"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.58" stop-color="#8B8070" stop-opacity="0"/>
      <stop offset="1"    stop-color="#8B8070" stop-opacity="0.17"/>
    </radialGradient>

    <linearGradient id="top0" gradientUnits="userSpaceOnUse" x1="178" y1="186" x2="846" y2="218"><stop offset="0" stop-color="#8496AE"/><stop offset="1" stop-color="#61738B"/></linearGradient>
    <linearGradient id="face0" gradientUnits="userSpaceOnUse" x1="0" y1="218" x2="0" y2="280"><stop offset="0"    stop-color="#586A80"/><stop offset="0.46" stop-color="#43536A"/><stop offset="0.88" stop-color="#2B3648"/><stop offset="1"    stop-color="#1F2937"/></linearGradient>
    <linearGradient id="fold0" gradientUnits="userSpaceOnUse" x1="0" y1="218" x2="0" y2="232"><stop offset="0"   stop-color="#131A26" stop-opacity="0.52"/><stop offset="0.5" stop-color="#131A26" stop-opacity="0.20"/><stop offset="1"   stop-color="#131A26" stop-opacity="0"/></linearGradient>
    <linearGradient id="lip0" gradientUnits="userSpaceOnUse" x1="178" y1="0" x2="846" y2="0"><stop offset="0"    stop-color="#C6D2E2" stop-opacity="0.30"/><stop offset="0.24" stop-color="#C6D2E2" stop-opacity="0.72"/><stop offset="1"    stop-color="#C6D2E2" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="top1" gradientUnits="userSpaceOnUse" x1="228" y1="342" x2="796" y2="374"><stop offset="0" stop-color="#8496AE"/><stop offset="1" stop-color="#61738B"/></linearGradient>
