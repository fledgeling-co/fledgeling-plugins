    <linearGradient id="fold1" gradientUnits="userSpaceOnUse" x1="0" y1="374" x2="0" y2="388"><stop offset="0"   stop-color="#131A26" stop-opacity="0.52"/><stop offset="0.5" stop-color="#131A26" stop-opacity="0.20"/><stop offset="1"   stop-color="#131A26" stop-opacity="0"/></linearGradient>
    <linearGradient id="lip1" gradientUnits="userSpaceOnUse" x1="228" y1="0" x2="796" y2="0"><stop offset="0"    stop-color="#C6D2E2" stop-opacity="0.30"/><stop offset="0.24" stop-color="#C6D2E2" stop-opacity="0.72"/><stop offset="1"    stop-color="#C6D2E2" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="top2" gradientUnits="userSpaceOnUse" x1="282" y1="488" x2="742" y2="520"><stop offset="0" stop-color="#8496AE"/><stop offset="1" stop-color="#61738B"/></linearGradient>
    <linearGradient id="face2" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="582"><stop offset="0"    stop-color="#586A80"/><stop offset="0.46" stop-color="#43536A"/><stop offset="0.88" stop-color="#2B3648"/><stop offset="1"    stop-color="#1F2937"/></linearGradient>
    <linearGradient id="fold2" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="534"><stop offset="0"   stop-color="#131A26" stop-opacity="0.52"/><stop offset="0.5" stop-color="#131A26" stop-opacity="0.20"/><stop offset="1"   stop-color="#131A26" stop-opacity="0"/></linearGradient>
    <linearGradient id="lip2" gradientUnits="userSpaceOnUse" x1="282" y1="0" x2="742" y2="0"><stop offset="0"    stop-color="#C6D2E2" stop-opacity="0.30"/><stop offset="0.24" stop-color="#C6D2E2" stop-opacity="0.72"/><stop offset="1"    stop-color="#C6D2E2" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="top3" gradientUnits="userSpaceOnUse" x1="344" y1="624" x2="680" y2="656"><stop offset="0" stop-color="#8496AE"/><stop offset="1" stop-color="#61738B"/></linearGradient>
    <linearGradient id="face3" gradientUnits="userSpaceOnUse" x1="0" y1="656" x2="0" y2="718"><stop offset="0"    stop-color="#586A80"/><stop offset="0.46" stop-color="#43536A"/><stop offset="0.88" stop-color="#2B3648"/><stop offset="1"    stop-color="#1F2937"/></linearGradient>
    <linearGradient id="fold3" gradientUnits="userSpaceOnUse" x1="0" y1="656" x2="0" y2="670"><stop offset="0"   stop-color="#131A26" stop-opacity="0.52"/><stop offset="0.5" stop-color="#131A26" stop-opacity="0.20"/><stop offset="1"   stop-color="#131A26" stop-opacity="0"/></linearGradient>
    <linearGradient id="lip3" gradientUnits="userSpaceOnUse" x1="344" y1="0" x2="680" y2="0"><stop offset="0"    stop-color="#C6D2E2" stop-opacity="0.30"/><stop offset="0.24" stop-color="#C6D2E2" stop-opacity="0.72"/><stop offset="1"    stop-color="#C6D2E2" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="top4" gradientUnits="userSpaceOnUse" x1="411" y1="750" x2="613" y2="782"><stop offset="0" stop-color="#8496AE"/><stop offset="1" stop-color="#61738B"/></linearGradient>
    <linearGradient id="face4" gradientUnits="userSpaceOnUse" x1="0" y1="782" x2="0" y2="844"><stop offset="0"    stop-color="#586A80"/><stop offset="0.46" stop-color="#43536A"/><stop offset="0.88" stop-color="#2B3648"/><stop offset="1"    stop-color="#1F2937"/></linearGradient>
    <linearGradient id="fold4" gradientUnits="userSpaceOnUse" x1="0" y1="782" x2="0" y2="796"><stop offset="0"   stop-color="#131A26" stop-opacity="0.52"/><stop offset="0.5" stop-color="#131A26" stop-opacity="0.20"/><stop offset="1"   stop-color="#131A26" stop-opacity="0"/></linearGradient>
    <linearGradient id="lip4" gradientUnits="userSpaceOnUse" x1="411" y1="0" x2="613" y2="0"><stop offset="0"    stop-color="#C6D2E2" stop-opacity="0.30"/><stop offset="0.24" stop-color="#C6D2E2" stop-opacity="0.72"/><stop offset="1"    stop-color="#C6D2E2" stop-opacity="0.22"/></linearGradient>

    <!-- porcelain light coming back up under a slab that has not landed -->
    <linearGradient id="bounceup" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93A6BE" stop-opacity="0"/>
      <stop offset="1" stop-color="#93A6BE" stop-opacity="0.42"/>
    </linearGradient>

    <!-- the accent. Dark saturated body, much brighter lit face, per apple-26.
         r02: the top face now stays at the LIFTED register for most of its run
         rather than ramping down through it. At r01 the accent's lit face and the
         slate slabs' lit faces measured 1.02:1 — identical luminance, adjacent
         hue — so the accent read as "the teal one" rather than as the lit one,
         which is the whole point of the tile. -->
    <!-- r05: the accent measured 3.43:1 across its own fold where every slate
         slab measures 2.23:1, so its pale top read as a mint cap stuck onto a
         dark body rather than as one lit object. The body now starts BRIGHT
         immediately under the fold and deepens from there — apple-06's
         emissive-from-within tell — which closes the fold and keeps the lit face
         chromatic instead of near-white. -->
    <linearGradient id="accface" gradientUnits="userSpaceOnUse"
        x1="0" y1="782" x2="0" y2="844">
      <stop offset="0"    stop-color="#2E97A3"/>
      <stop offset="0.24" stop-color="#1F7F89"/>
      <stop offset="0.52" stop-color="#186A73"/>
      <stop offset="0.86" stop-color="#0B3A41"/>
      <stop offset="1"    stop-color="#186A73"/>
    </linearGradient>
    <linearGradient id="acctop" gradientUnits="userSpaceOnUse"
        x1="411" y1="750"
        x2="613" y2="782">
      <stop offset="0"    stop-color="#63C3CC"/>
      <stop offset="0.48" stop-color="#63C3CC"/>
      <stop offset="1"    stop-color="#2E97A3"/>
    </linearGradient>
    <!-- emissive from within: the body glows just under its own lit fold -->
    <linearGradient id="accinner" gradientUnits="userSpaceOnUse"
        x1="0" y1="782" x2="0" y2="808">
      <stop offset="0" stop-color="#63C3CC" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#63C3CC" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wellTight" gradientUnits="userSpaceOnUse"
        cx="512" cy="797" r="186"
        gradientTransform="translate(0,318.8) scale(1,0.6)">
      <stop offset="0"    stop-color="#3FB3BE" stop-opacity="0.42"/>
      <stop offset="0.50" stop-color="#3FB3BE" stop-opacity="0.18"/>
      <stop offset="1"    stop-color="#3FB3BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellWide" gradientUnits="userSpaceOnUse"
        cx="512" cy="797" r="300"
        gradientTransform="translate(0,318.8) scale(1,0.6)">
      <stop offset="0"    stop-color="#3FB3BE" stop-opacity="0.13"/>
      <stop offset="0.56" stop-color="#3FB3BE" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#3FB3BE" stop-opacity="0"/>
    </radialGradient>
    <!-- the spill is a falloff from the emitter, so it warms only the slab the
         accent actually faces. A gradient clipped to every slab would spend the
         accent on decoration; shipyard learned that at r02. -->
    <radialGradient id="spill" gradientUnits="userSpaceOnUse"
        cx="512" cy="744" r="150">
      <stop offset="0"    stop-color="#3FB3BE" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#3FB3BE" stop-opacity="0.11"/>
      <stop offset="1"    stop-color="#3FB3BE" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurS" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="blurM" x="-60%" y="-160%" width="220%" height="420%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="blurL" x="-70%" y="-200%" width="240%" height="500%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

