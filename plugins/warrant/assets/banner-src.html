<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  /* Familjen Grotesk: an official-feeling grotesque with slightly narrow forms.
     The shelf is mostly workhorse grotesques; this one reads as a document face
     without tipping into legal pastiche, which the subject would invite.
     Deliberately not Archivo (shipyard's shop-floor face) and not Instrument
     Sans (the conductors'). */
  body { width: 1600px; height: 520px; overflow: hidden; position: relative;
         background: radial-gradient(122% 158% at 26% 28%,
                     #F6F7F5 0%, #EEF0EE 44%, #E2E6E4 82%, #D6DBD9 100%);
         font-family: "Familjen Grotesk", sans-serif; }
  .lockup { position: absolute; left: 132px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 76px; }
  .icon { width: 320px; height: 320px;
          filter: drop-shadow(0 22px 40px rgba(52, 66, 70, .26))
                  drop-shadow(0 4px 10px rgba(52, 66, 70, .16)); }
  .words { padding-bottom: 6px; }
  .wordmark { font-size: 118px; font-weight: 700; letter-spacing: -0.028em;
              line-height: 1; color: #2E3A40; display: flex; align-items: center; }
  /* The icon's signature move as the wordmark's accent: the one scope that has
     been earned, lit and landed. A single slab rather than five, because the
     icon already carries the stack and repeating it would say it twice. */
  .earned { width: 62px; height: 15px; margin-left: 28px; border-radius: 3px; flex: none;
            background: linear-gradient(180deg, #3FA9B4 0%, #186A73 82%);
            box-shadow: 0 0 20px rgba(63, 169, 180, .42),
                        0 6px 10px rgba(24, 60, 66, .28); }
  .tagline { margin-top: 26px; font-size: 30px; font-weight: 400; color: #55636A;
             letter-spacing: -0.004em; }
  /* the ladder, drawn once at the right edge as the ground's own texture:
     four withheld scopes and nothing lit, because the tile carries the lit one */
  /* Right-aligned, not centred. Centred decreasing bars read as a paragraph of
     shrinking text lines, which is a loading skeleton -- the wrong association
     for this subject. Anchored to one edge they read as a wedge. */
  .ghost { position: absolute; right: 96px; top: 50%; transform: translateY(-50%);
           display: flex; flex-direction: column; align-items: flex-end; gap: 26px; }
  .ghost i { display: block; height: 15px; border-radius: 3px;
             background: rgba(46, 58, 64, .085); }
</style>
</head>
