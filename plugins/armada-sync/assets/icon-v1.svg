<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="armada-sync">
<title>armada-sync</title>
<!--
  Direction "Entry of Record": Tahoe gel-glass sub-register (a): porcelain cushion tile + gel object.
