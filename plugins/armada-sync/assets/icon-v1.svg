  <!-- porcelain cushion -->
  <linearGradient id="tileBase" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FEFDFB"/>
    <stop offset=".55" stop-color="#F3F1EB"/>
    <stop offset="1" stop-color="#E8E5DC"/>
  </linearGradient>
  <radialGradient id="tileGlow" cx="512" cy="176" r="640" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tileVignette" cx="512" cy="512" r="700" gradientUnits="userSpaceOnUse">
    <stop offset=".56" stop-color="#7A705C" stop-opacity="0"/>
    <stop offset="1" stop-color="#7A705C" stop-opacity=".15"/>
  </radialGradient>
  <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset=".38" stop-color="#FFFFFF" stop-opacity=".12"/>
    <stop offset=".62" stop-color="#7A705C" stop-opacity="0"/>
    <stop offset="1" stop-color="#7A705C" stop-opacity=".26"/>
  </linearGradient>

  <!-- quiet entry lines: graphite gel -->
  <linearGradient id="barGrad" x1="0" y1="240" x2="0" y2="784" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#5A616D"/>
    <stop offset=".5" stop-color="#434A55"/>
    <stop offset="1" stop-color="#333944"/>
  </linearGradient>
  <linearGradient id="barRim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
    <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".14"/>
  </linearGradient>

  <!-- the seal -->
  <linearGradient id="chopGrad" x1="0" y1="454" x2="0" y2="570" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F8845A"/>
    <stop offset=".40" stop-color="#EC5A33"/>
    <stop offset=".80" stop-color="#D33C21"/>
    <stop offset="1" stop-color="#BB2F17"/>
  </linearGradient>
  <linearGradient id="chopRim" x1="0" y1="454" x2="0" y2="570" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
    <stop offset=".40" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#7A1A06" stop-opacity=".30"/>
  </linearGradient>
  <radialGradient id="chopBloom" cx="512" cy="474" r="330" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFD3B8" stop-opacity=".40"/>
    <stop offset="1" stop-color="#FFD3B8" stop-opacity="0"/>
  </radialGradient>

  <!-- the freshly stamped entry: frosted white, ground hue bleeding through -->
  <linearGradient id="frostGrad" x1="0" y1="480" x2="0" y2="544" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
    <stop offset=".55" stop-color="#FFF3ED" stop-opacity=".88"/>
    <stop offset="1" stop-color="#FFE2D6" stop-opacity=".80"/>
  </linearGradient>
  <linearGradient id="frostRim" x1="0" y1="480" x2="0" y2="544" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".98"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#A83A1E" stop-opacity=".34"/>
  </linearGradient>

  <filter id="bSm" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="bMd" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="15"/></filter>
  <filter id="bLg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="bXl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="54"/></filter>
