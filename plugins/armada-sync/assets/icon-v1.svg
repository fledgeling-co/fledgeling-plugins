<g clip-path="url(#tileMask)">

  <!-- ══ bg: porcelain cushion tile ══ -->
  <g id="bg">
    <rect width="1024" height="1024" fill="url(#tileBase)"/>
    <rect width="1024" height="1024" fill="url(#tileGlow)"/>
    <rect width="1024" height="1024" fill="url(#tileVignette)"/>
  </g>

  <!-- ══ mid: the ink bleed and the quiet entries already on record ══ -->
  <g id="mid">
    <!-- ink haloing into the paper: the stamp landed a moment ago -->
    <rect x="132" y="398" width="760" height="228" rx="98" fill="#D33C21" opacity=".09" filter="url(#bXl)"/>
    <rect x="168" y="432" width="688" height="160" rx="66" fill="#D33C21" opacity=".15" filter="url(#bLg)"/>

    <!-- contact shadows, one soft top light -->
    <g fill="#5C523F" opacity=".20" filter="url(#bSm)">
      <rect x="245" y="253" width="470" height="64" rx="32"/>
      <rect x="245" y="371" width="530" height="64" rx="32"/>
      <rect x="245" y="607" width="504" height="64" rx="32"/>
      <rect x="245" y="725" width="408" height="64" rx="32"/>
    </g>

    <!-- the other entries: present, calm, untouched by this run.
         Widths ragged like real lines of prose, the last one trailing short,
         the signal that reads "page of text" rather than "chart". -->
    <g fill="url(#barGrad)">
      <rect x="245" y="244" width="470" height="64" rx="32"/>
      <rect x="245" y="362" width="530" height="64" rx="32"/>
      <rect x="245" y="598" width="504" height="64" rx="32"/>
      <rect x="245" y="716" width="408" height="64" rx="32"/>
    </g>
  </g>

  <!-- ══ fg: the seal, and the one entry it certifies ══ -->
  <g id="fg">
    <rect x="192" y="466" width="640" height="116" rx="40" fill="#A33418" opacity=".30" filter="url(#bMd)"/>
    <rect x="192" y="454" width="640" height="116" rx="40" fill="url(#chopGrad)"/>
    <rect x="192" y="454" width="640" height="116" rx="40" fill="url(#chopBloom)"/>

    <!-- the entry's own shadow onto the seal -->
    <rect x="245" y="486" width="534" height="64" rx="32" fill="#8E2A10" opacity=".28" filter="url(#bSm)"/>
    <!-- frosted, with the seal's hue bleeding through the thinner lower half -->
    <rect x="245" y="480" width="534" height="64" rx="32" fill="url(#frostGrad)"/>
  </g>

