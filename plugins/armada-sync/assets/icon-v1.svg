  that entry knocked out in frosted white, ink haloing into the paper.
  Layers map 1:1 onto Icon Composer: #bg / #mid / #fg / #highlight.
  Full-bleed 1024 artwork; the squircle is a CLIP for preview only, with no baked corners, no baked shadow.
-->
