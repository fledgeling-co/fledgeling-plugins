<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200">
<defs>
  <filter id="rel" x="-100" y="-100" width="400" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.30 0.05" numOctaves="3" seed="7" result="h"/>
    <feDiffuseLighting in="h" surfaceScale="1.2" diffuseConstant="1" lighting-color="#FFFFFF" result="lit">
      <feDistantLight azimuth="225" elevation="42"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1.4945" k2="0" k3="0" k4="0"/>
  </filter>
  <linearGradient id="rg" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFF" stop-opacity="1"/>
    <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="rm" maskUnits="userSpaceOnUse" x="-100" y="-100" width="400" height="400">
    <rect x="-100" y="-100" width="400" height="400" fill="url(#rg)"/>
  </mask>
</defs>
<g id="base"><rect width="200" height="200" fill="#B0A890"/><rect x="20" y="20" width="60" height="60" fill="#D8D2C4"/></g>
<g mask="url(#rm)"><g filter="url(#rel)"><use xlink:href="#base" href="#base"/></g></g>
</svg>
