<!--
  Every colour here is a named constant out of assets/build_icon.py, so the
  banner and the icon cannot drift apart:

    GROUND_HI/MID/LO      #FFFDF7 / #F6F1E6 / #E2D9C5, the family porcelain
    CHART_INK             #2B3038, the battens
    EMBER                 #C4622D, the one accent
    GRATICULE             #8A7458, the chart grid
    SHADOW                #6E5C44, the ground's own hue darkened, never blue
    BEARINGS, ERRORS      22/66/-40 degrees, missing the fix by 84/-124/-96

  THE SIGNATURE MOVE, held from the icon: the ember is not drawn. It is the
  pocket of ground three bearing lines fail to cover. So the accent appears
  nowhere in this banner except inside a cocked hat, and NOT in the wordmark,
  even though a warm character would be the easy move. An orange letter would
  be ornament, and the icon's whole rule is that the accent has to be earned by
  three lines failing to agree.

  The reprise at the right is the same three bearings drawn three times with the
  error scaled down: 0.62, 0.34, 0.13. It is the argument in one glance. More
  independent sources do not move the fix, they shrink the area you could be in,
  and the last hat is the 38 independent domains this skill's own research panel
  actually reached.

  Wordmark is IBM Plex Sans 600. Chosen rather than reached for: it was drawn for
  technical documentation, which is the register the icon is already in, and
  "positioning" is a twelve-character lowercase word whose rhythm lives on the
  two i-dots and the double n. Plex keeps those even at display size where a
  geometric face lets the o-s-i-t sequence go slack. Space Grotesk is eli5's.

  Artwork is the real icon.png downscaled to 2x its display size and inlined as
  a data URI: a file:// page does not fetch file:// subresources, and it fails
  silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 46% 44%, rgba(138,116,88,0) 56%, rgba(138,116,88,.24) 100%),
      linear-gradient(163deg, #FFFDF7 0%, #F6F1E6 46%, #E2D9C5 100%);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 58px;
    padding: 0 92px; overflow: hidden; position: relative;
  }

  /* A plain box-shadow, not filter: drop-shadow(): the capture engine accepts
     the filter and never paints it, so the banner would render shadowless and
     pass every check. Radius is the squircle's at this size: 272 * 0.2245. */
  .iconwrap { width: 272px; height: 272px; flex: none; border-radius: 61px;
               box-shadow: 0 18px 26px rgba(110,92,68,.11); }
  .icon { width: 272px; height: 272px; display: block; }

  h1 { font-size: 92px; font-weight: 600; letter-spacing: -.028em; line-height: 1;
        color: #2B3038; }
  p { margin-top: 24px; font-size: 25px; line-height: 1.44; max-width: 578px;
       font-weight: 400; color: #5A5449; }
  p b { color: #2B3038; font-weight: 500; }

  .bench { position: absolute; right: 78px; top: 168px;
            display: flex; gap: 40px; align-items: flex-start; }
  .bench figure { width: 118px; text-align: center; }
  .hat { width: 118px; height: 118px; }
  .bench figcaption { margin-top: 12px; font-size: 15px; font-weight: 500;
                       letter-spacing: .01em; color: #6E5C44; white-space: nowrap; }
</style>
