<!--
  mac-design-digest README banner, 1600x520, rendered at 2x to 3200x1040.

  DERIVED, NOT EYEBALLED. Every number below is read out of this plugin's own
  `build_icon.py` (the inlaid master promoted on 19 Aug 2026) and scaled by one
  factor, K. No value here came from a sibling banner, because no two icons in
  this set are lit the same way and a borrowed light vector is the exact mistake
  the derivation rule exists to stop. What was read across:

    ground        radial cx 0.42 cy 0.34 r 0.82, stops
                  #FDFCFA 0 / #E7E4DC 0.62 / #D8D3C9 1
                  The banner's own ground is that gradient, same centre, same
                  three stop offsets, restated in CSS.
    light axis    the glaze gradient runs (0.1, 0) to (0.88, 1) across the plate
                  box, which is 45.3 degrees down-right. Every gradient in the
                  field uses that vector, and the specular sits on the top-left
                  arris and the porcelain fillet on the far bottom-right, which
                  is the same key the icon declares.
    plate         172, 232, 680, 536, r 60. Aspect 1.269.
    marks         label 240,328,236,20 / value 240,392,336,66 r 22 /
                  footnote 240,500,168,18. Inset from the plate's left edge is
                  68, and that inset is also the field's own left inset.
    seal          centre 823, 739 (moved there on 19 Aug when the icon's seal
                  was pushed out to straddle the plate's lower-right corner);
                  r_out 112, r_in 95, 12 lobes, ring 66, boss 40, countersink
                  132 leaving a 20 collar. 53.9% of the seal now hangs off the
                  plate, and out there it sits on the porcelain ground rather
                  than on the collar — 3.01:1 against it, measured on the icon
                  render, where the collar carries the on-plate half at 2.82:1.
    accent ramp   #F4794A 0 / #E8542A 0.42 / #D64A22 0.82 / #B23F1C 1, on the
                  axis (0.14, 0.04) to (0.86, 0.96). Spent on the seal and on
                  the two provenance marks in the eyebrow, nowhere else.
    contact       #6B5F4C, and the plate's own shadow is dy 18 with a 22 blur
                  against a 536 plate. The icon tile on the left casts the same
                  shadow in proportion to its own size: dy 10, blur 12.

  THE FIELD is the same plate at reading size, carrying the icon's own three
  inlaid marks and its own seal at their derived positions. Nothing in it is
  invented and nothing is added: the tile on the left is one entry seen as an
  icon, and the field is that same entry seen as a page. That is the skill's
  argument, which is that a corpus is not a different kind of thing from the
  record it accumulates.

  The field origin moved with the seal, and this is the one number here that is
  a composition choice rather than a reading. It was 1128, 168, chosen so the
  page ran off the right edge and the bottom. The seal now sits ON that
  discarded corner, so the old crop threw the signature move away: at 1128, 168
  the field showed a 72px stub of wax in the frame's bottom-right and nothing
  else of it. The field is now anchored at 1030, 44 — the sealed corner whole
  and inside the frame, the page open on the left where the fade carries it
  under the copy. One open edge is enough to say "this continues"; the corner
  with the seal on it is the half worth showing.

  It fades in from the left so it never competes with the copy, and it is held
  at half strength so the icon stays the darkest mass in the frame. The icon's
  plate reads L 0.046; the field's composites to L 0.286, measured on the
  render where the fade mask is at full strength.

  TYPE. Newsreader for the wordmark and IBM Plex Mono for the provenance
  marks, which is the pairing `report` already ships in this set. Newsreader is
  the set's document face, used by the three skills whose output is a written
  document you read, and this skill's output is exactly that: a persistent
  corpus with a ledger read first on every invocation. The mono carries the two
  marks, in the same role mac-craft gives it.

  RENDERING NOTES for whoever next opens this file. This engine accepts and
  never paints `filter: drop-shadow()`, an inset `box-shadow`, or
  `clip-path: ellipse()`. The icon's shadow here is therefore an inline SVG
  feGaussianBlur behind the img, which does paint. Do not reach for the CSS
  filter; `render_banner.py` refuses the source outright if you do.
-->
<style>
  * { margin: 0; box-sizing: border-box; }

  /* The icon's own ground: radial cx 0.42 cy 0.34, and the same three stops at
     the same offsets. Not page-white, so it holds on GitHub's light and dark
     grounds alike. */
  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background: radial-gradient(115% 210% at 42% 34%,
                  #FDFCFA 0%, #E7E4DC 62%, #D8D3C9 100%);
    font-family: "Newsreader", serif;
    -webkit-font-smoothing: antialiased;
  }

  svg.plate-field, svg.tile-shadow { position: absolute; inset: 0; }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 74px; }
  .icon { width: 288px; height: 288px; flex: none; position: relative; }

  .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace;
             font-size: 16px; font-weight: 450; letter-spacing: .01em;
             color: #6B5F4C; margin-bottom: 20px; white-space: nowrap; }
  .eyebrow b { color: #D64A22; font-weight: 450; }

  .wordmark { font-size: 70px; font-weight: 600; letter-spacing: -.021em;
              line-height: 1; color: #262B32; white-space: nowrap; }
  .essence { margin-top: 22px; font-size: 26px; font-weight: 400;
             line-height: 1.44; color: #6B5F4C; max-width: 572px; }
  .essence b { color: #262B32; font-weight: 600; }
</style>

<body>
  <!-- The tile's contact shadow, as an inline SVG blur rather than a CSS
       filter, because this engine drops the filter without saying so. -->
  <svg class="tile-shadow" width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="tileblur" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="12"/>
      </filter>
    </defs>
    <g id="tileshadow"></g>
  </svg>

  <svg class="plate-field" width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- the glaze, on the icon's own light axis and its own three values -->
      <linearGradient id="glaze" x1="0.1" y1="0" x2="0.88" y2="1">
        <stop offset="0"    stop-color="#535A66"/>
        <stop offset="0.52" stop-color="#3A4048"/>
        <stop offset="1"    stop-color="#262B32"/>
      </linearGradient>
      <!-- the porcelain body, seen wherever the glaze is cut -->
      <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0"    stop-color="#FFFEFB"/>
        <stop offset="0.55" stop-color="#F3EFE6"/>
        <stop offset="1"    stop-color="#DCD6C9"/>
      </linearGradient>
      <linearGradient id="inlaid" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0" stop-color="#F3EFE6"/>
        <stop offset="1" stop-color="#FFFEFB"/>
      </linearGradient>
      <!-- the wax, on the seal's own axis and its own four stops -->
      <linearGradient id="wax" x1="0.14" y1="0.04" x2="0.86" y2="0.96">
        <stop offset="0"    stop-color="#F4794A"/>
        <stop offset="0.42" stop-color="#E8542A"/>
        <stop offset="0.82" stop-color="#D64A22"/>
        <stop offset="1"    stop-color="#B23F1C"/>
      </linearGradient>
      <linearGradient id="die" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
        <stop offset="0" stop-color="#F27A4C"/>
        <stop offset="1" stop-color="#DB4A22"/>
      </linearGradient>
      <filter id="plateblur" x="-30%" y="-30%" width="180%" height="200%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>
      <filter id="sealblur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <!-- the field fades in from the left so the page reads as continuing
           past the frame on every side rather than as a second object -->
      <linearGradient id="ramp" gradientUnits="userSpaceOnUse"
                      x1="1088" y1="0" x2="1252" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="520">
        <rect x="1000" y="0" width="600" height="520" fill="url(#ramp)"/>
      </mask>
    </defs>
    <g id="field" mask="url(#fade)" opacity="0.52"></g>
    <!-- The seal rides its own opacity. Inside the 0.52 field group the
         vermilion composites to a pale salmon, and this marketplace spends one
         warm accent per icon: a washed-out accent is the same defect as a
         second hue. It stays under the icon's own seal in strength so the tile
         remains the focal object. -->
    <g id="fieldseal" mask="url(#fade)" opacity="0.78"></g>
  </svg>

    <div>
      <div class="eyebrow"><b>(measured)(canon)</b> &middot; canon needs three independent apps</div>
      <div class="wordmark">mac-design-digest</div>
      <div class="essence">One Mac app at a time, into a corpus that outlives
        the session. <b>Every value says how well it is known.</b></div>
    </div>
  </div>

  <script>
    // ---- read straight out of this plugin's build_icon.py -----------------
    const ICON = {
      TILE: 1024,
      PLATE: { x: 172, y: 232, w: 680, h: 536, r: 60 },
      LABEL: { x: 240, y: 328, w: 236, h: 20 },
      VALUE: { x: 240, y: 392, w: 336, h: 66, r: 22 },
      FOOT:  { x: 240, y: 500, w: 168, h: 18 },
      SEAL:  { cx: 823, cy: 739, rOut: 112, rIn: 95, lobes: 12,
               ring: 66, boss: 40, socket: 132 },
      SHADOW: { dy: 18, blur: 22 },          // the plate's own, against h 536
    };

    // ---- the tile on the left --------------------------------------------
    const ICON_LEFT = 112, ICON_SIZE = 288;
    const ICON_TOP = (520 - ICON_SIZE) / 2;
    const si = ICON_SIZE / ICON.TILE;

    // The tile casts the shadow its own plate casts, in proportion to its size:
    // dy and blur are the icon's 18 and 22 taken as fractions of its 536 plate
    // and re-applied to the 288 tile. Nothing here is a taste number.
    const TILE_DY   = ICON_SIZE * ICON.SHADOW.dy   / ICON.PLATE.h;
    const TILE_BLUR = ICON_SIZE * ICON.SHADOW.blur / ICON.PLATE.h;

    // ---- the field: the same plate at reading size ------------------------
    const K = 0.72;                     // tile space -> field space
    const FX = 1030, FY = 44;           // the sealed corner whole, open on the left

    const f = (n) => n.toFixed(2);
    const P = (v) => v * K;
    const px = (v) => FX + (v - ICON.PLATE.x) * K;   // tile x -> field x
    const py = (v) => FY + (v - ICON.PLATE.y) * K;   // tile y -> field y

    const rr = (x, y, w, h, r, attrs) =>
      `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" ` +
      `rx="${f(r)}" ry="${f(r)}" ${attrs}/>`;

    // the notarial rim, ported from the build script's `scalloped`
    function scalloped(cx, cy, rOut, rIn, lobes) {
      const step = 2 * Math.PI / lobes;
      const pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const [x0, y0] = pt(rIn, -step / 2);
      let d = `M${f(x0)},${f(y0)}`;
      for (let i = 0; i < lobes; i++) {
        const peak = i * step, valley = peak + step / 2;
        const [pxx, pyy] = pt(rOut * 1.06, peak);
        const [vx, vy] = pt(rIn, valley);
        d += ` Q${f(pxx)},${f(pyy)} ${f(vx)},${f(vy)}`;
      }
      return d + ' z';
    }

    function arc(cx, cy, r, a0, a1) {
      const rad = (d) => d * Math.PI / 180;
      const x0 = cx + r * Math.cos(rad(a0)), y0 = cy + r * Math.sin(rad(a0));
      const x1 = cx + r * Math.cos(rad(a1)), y1 = cy + r * Math.sin(rad(a1));
      const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
      return `M${f(x0)},${f(y0)} A${f(r)},${f(r)} 0 ${large} 1 ${f(x1)},${f(y1)}`;
    }

           rr(PL.x, PL.y + P(ICON.SHADOW.dy), PL.w, PL.h, PL.r, 'fill="#6B5F4C"') +
