<style>
  /* Values lifted from assets/build_icon.py and named where they land. Ground GROUND_HI #FDFBF6 / GROUND_MID
     #F4EFE3 / GROUND_EDGE #E1D9C8 with VIGNETTE #8B7F66 at VIGNETTE_A 0.22; light from the upper left
     (SHADOW_DX 0.32, SHADOW_DY 0.95), so the ground falls toward the lower right and every shadow drops right and
     down in SHADOW #3A3126. Screen: BEZEL_HI #77706A, SCREEN_HI #57514A, SCREEN_LO #26221F, SCREEN_WALL #1B1815;
     the bezel is BEZEL / SCREEN_H of the screen's height, its rounding SCREEN_R / SCREEN_H. The one accent is the
     triangle's gel, ACCENT_CORE #FFE2C2 / ACCENT_HI #F7843F / ACCENT #EA4A24 / ACCENT_DEEP #7A2008, plus EMBER_A
     on the ground beneath it. Family face Instrument Sans, as on every "making" banner (motion-craft, design-craft,
     ux-craft, deck-craft, launch-craft), so this one reads as a sibling.

     The bench on the right is the icon's idea laid flat as the thing the skill makes: one overview screen, pressed
     by the icon's own cursor polygon with its two rings, and four shorts beneath it. Only the overview's triangle
     carries the accent. The stamp counts what is drawn.

     Artwork is the real icon.png at 2x its display size, inlined as a data URI, because a file:// page does not
     fetch file:// subresources and fails silently when it tries. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(120% 320% at 36% 26%, rgba(255,255,255,.86) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(120% 175% at 50% 50%, rgba(139,127,102,0) 54%, rgba(139,127,102,.22) 100%),
      linear-gradient(162deg, #FDFBF6 0%, #F4EFE3 56%, #E1D9C8 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    position: relative; overflow: hidden;
  }
  .lockup { position: absolute; left: 92px; top: 140px; display: flex; align-items: center; gap: 44px; }
  .tile { position: absolute; inset: 12px; border-radius: 48px; box-shadow: 7px 18px 20px rgba(58,49,38,.18); }
  .icon { position: relative; width: 240px; height: 240px; display: block; }
  .text { width: 700px; }
  h1 { font-size: 80px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #1E1B16; white-space: nowrap; }
  p { margin-top: 24px; font-size: 26px; line-height: 1.38; font-weight: 400; color: #4A443A; }
  p b { color: #C2391A; font-weight: 500; }          /* ACCENT lifted for text-size contrast on porcelain */
  .bench { position: absolute; left: 1150px; top: 150px; width: 340px; height: 250px; }
  .stamp { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 16px; fill: #6F6658; }
</style>
