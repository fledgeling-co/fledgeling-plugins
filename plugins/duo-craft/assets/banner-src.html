  .r { left: 171px; right: 30px; }

  .ttl { position: absolute; left: 14px; top: 20px; width: 90px; height: 12px; border-radius: 6px; background: #E9562A; }
  .ln { position: absolute; left: 14px; height: 6px; border-radius: 3px; background: #CFC6B8; }
