<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1600px; height:520px; overflow:hidden; position:relative;

         font-family:"Instrument Sans", sans-serif; }

  /* The field echoes the skill: one lattice, soft everywhere and resolved in
     exactly one place. The banner makes the same argument the icon does. */
  svg.field { position:absolute; inset:0; }

  .lockup { position:absolute; left:128px; top:50%; transform:translateY(-50%);
            display:flex; align-items:center; gap:72px; }
  .icon { width:268px; height:268px; /* inert in this engine, removed: drop-shadow(0 20px 42px rgba(74,66,52,.22)) */ }
  h1 { font-size:70px; font-weight:600; letter-spacing:-.028em; color:#2A2318; line-height:1; }
  .rule { width:64px; height:3px; background:#DA5526; margin:26px 0 22px; border-radius:2px; }
  p  { font-size:25px; line-height:1.42; color:#5A5344; max-width:640px; font-weight:400; }
  .verdicts { display:flex; gap:10px; margin-top:30px; }
  .v { font-family:"IBM Plex Mono", monospace; font-size:14px; letter-spacing:.02em;
       padding:7px 14px; border-radius:8px; }
  .pass { background:#E4F5EC; color:#1C6B47; }
  .adv  { background:#F1EBDF; color:#5A5344; }
  .inc  { background:#FBF2E0; color:#8A5A0E; }

  <script>
    // The lattice, drawn soft across the whole field and re-drawn sharp and finer
    // inside one circle. Same device as the icon, at banner scale.
    const svg = document.querySelector('svg.field');
    const mk = (spacing, stroke, w, op, clip, blur) => {
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('stroke', stroke); g.setAttribute('stroke-width', w);
      g.setAttribute('opacity', op); g.setAttribute('fill','none');
      if (clip) g.setAttribute('clip-path','url(#resolved)');
      if (blur) g.setAttribute('filter','url(#soft)');
      for (let x = -200; x < 1900; x += spacing) {
        const p = document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d', `M${x} -40 L${x-190} 560`); g.appendChild(p);
      }
      for (let y = -120; y < 700; y += spacing) {
        const p = document.createElementNS('http://www.w3.org/2000/svg','path');
        p.setAttribute('d', `M-40 ${y} L1640 ${y-80}`); g.appendChild(p);
      }
      svg.appendChild(g);
    };
    mk(74, '#B9AE97', 1.7, .50, false, true);                 // the world, soft
    const disc = document.createElementNS('http://www.w3.org/2000/svg','circle');
    disc.setAttribute('cx',1245); disc.setAttribute('cy',258); disc.setAttribute('r',132);
    disc.setAttribute('fill','#FFFFFF'); disc.setAttribute('opacity','.72');
    svg.appendChild(disc);
    mk(74, '#B9AE97', 1.5, .70, true, false);                 // resolved
    mk(18.5, '#B9AE97', .8, .42, true, false);                // and finer
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx',1245); ring.setAttribute('cy',258); ring.setAttribute('r',132);
    ring.setAttribute('fill','none'); ring.setAttribute('stroke','#3E342A');
    ring.setAttribute('stroke-width','7'); ring.setAttribute('opacity','.9');
    svg.appendChild(ring);
  </script>
