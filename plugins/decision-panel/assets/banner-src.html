<style>
  * { margin: 0; box-sizing: border-box; }
  /* The same porcelain sheet as clarify's banner, so the two read as one family. */
  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background:
      radial-gradient(120% 150% at 50% -10%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 55%),
      radial-gradient(115% 165% at 50% 50%, rgba(122,112,92,0) 52%, rgba(122,112,92,.16) 100%),
      linear-gradient(178deg, #FAF8F2 0%, #F1EEE4 52%, #E5E1D4 100%);
    font-family: "Instrument Sans", sans-serif;
  }
  /* The icon's device found again on the far side of the sheet: four clay marks
     aimed at one vermilion tick that runs off the edge. */
  .marks span {
    position: absolute; width: 22px; height: 78px; border-radius: 11px;
    background: linear-gradient(#A99D8A, #857967);
    box-shadow: 0 8px 16px rgba(92,82,64,.18);
  }
  .tick { position: absolute; left: 1396px; top: 268px; width: 260px; height: 130px; }
  .tick i { position: absolute; height: 40px; border-radius: 20px;
            background: linear-gradient(#EC6B3E, #D24B1E 70%, #B23A14);
            box-shadow: 0 10px 22px rgba(163,52,24,.24); }
  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 68px; }
  .wordmark { font-size: 92px; font-weight: 700; letter-spacing: -.035em;
              line-height: 1; color: #2E343D; white-space: nowrap; }
  .tagline { margin-top: 24px; font-size: 26px; font-weight: 400;
             color: #756E60; letter-spacing: .001em; }
  .tagline b { color: #3A414B; font-weight: 500; }
  .icon-seat { position: relative; display: inline-block; flex: none; line-height: 0; }
  .icon-shadow { position: absolute; left: 0; top: 0; width: 288px; height: 288px;
                 border-radius: 22.37%; box-shadow: 0 16px 41px rgba(92,82,64,0.108); }
  .icon { position: relative; width: 288px; height: 288px; }
</style>
