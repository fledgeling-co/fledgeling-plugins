<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Every value below is lifted from build_icon.py rather than eyeballed off a
     sibling banner. KEY = (0.34, 0.26), so the light lands at 34% across and 26%
     down and every ramp hangs off that point. GROUND, INK_*, ACCENT_* and SHADOW
     are the master's own constants, which are in turn the sibling's, because the
     two banners have to sit on a page together. The one thing that is not from
     the icon is the face: Instrument Sans is the set wordmark, linked rather
     than local, so a re-render on another machine cannot silently substitute a
     different one. */

  * { margin: 0; box-sizing: border-box; }

  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background:
      radial-gradient(88% 150% at 34% 26%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 58%),
      radial-gradient(112% 168% at 50% 46%, rgba(139,127,102,0) 52%, rgba(139,127,102,.15) 100%),
      linear-gradient(176deg, #FCFAF4 0%, #F3EDE1 54%, #DED5C2 100%);
    font-family: "Instrument Sans", sans-serif;
  }

  /* The icon's device, found again on the far side of the sheet. The sibling
     banner runs a queue of graphite rails up against a single vermilion gate
     and leaves the porcelain past it bare, because that skill stops at the line.
     Here one vermilion cut crosses the same stack and every rail CONTINUES on
     the far side of it. That difference is the whole distinction between the two
     skills, and it is the only thing that changed between the two banners. */
  /* 1054, not the sibling's 942: "review" sets 50px wider than the gap the
     sibling left, and at 942 the stack ran through the wordmark. */
  .queue { position: absolute; left: 1054px; top: 122px; }
  .rail {
    position: absolute; height: 26px; border-radius: 13px; overflow: hidden;
    background: linear-gradient(178deg, #454B57 0%, #2C313A 46%, #161A20 100%);
    box-shadow: 0 8px 17px rgba(110,96,73,.20), 0 2px 5px rgba(65,55,42,.26);
  }
  /* the rail's lit shoulder, as its own element: this engine accepts an inset
     box-shadow and never paints it */
  .rail i {
    position: absolute; left: 13px; right: 13px; top: 2px; height: 5px;
    border-radius: 3px; background: rgba(255,243,226,.34);
  }

  /* One void per rail, all four on one straight line 11deg off vertical. The
     rail clips it, so the two faces stay flat and parallel and nothing pokes
     out past the rail's own rounded end. */
  .cut {
    position: absolute; top: -22px; height: 70px; width: 22px;
    transform: rotate(11deg);
    background: linear-gradient(90deg, #C9481C 0%, #DE5A28 34%, #F2823C 100%);
  }
  /* the wall the key cannot reach, and the graphite lip it can: the same pair
     the master builds by hand, because a boundary the cut created is invisible
     to any mask keyed on the shape it cut */
  .cut em {
    position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
    background: linear-gradient(90deg, rgba(65,55,42,.86) 0%, rgba(188,58,20,0) 100%);
  }
  .cut s {
    position: absolute; right: -3px; top: 0; bottom: 0; width: 3px;
    background: rgba(255,243,226,.42); text-decoration: none;
  }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 62px; }
  .icon { width: 288px; height: 288px; display: block; }
  /* the icon's own contact shadow, as a backing box, because this engine
     accepts filter: drop-shadow and never paints it */
  .iconseat { position: relative; width: 288px; height: 288px; }
  .iconseat span {
    position: absolute; left: 26px; right: 26px; bottom: 6px; height: 54px;
    border-radius: 40px; background: rgba(110,96,73,.30);
    box-shadow: 0 18px 34px 10px rgba(110,96,73,.26);
  }
  .iconseat img { position: absolute; inset: 0; }

  .wordmark { font-size: 92px; font-weight: 700; letter-spacing: -.035em;
              line-height: 1; color: #2C313A; white-space: nowrap;
              display: flex; align-items: center; gap: 15px; }

  /* The name carries the icon's move: the hyphen in atlas-review is poured as
     the cut, at the master's own 23deg. */
  .wordmark .hyphen {
    display: inline-block; width: 34px; height: 14px; border-radius: 4px;
    position: relative; margin: 0 5px; transform: rotate(-21deg);
    background: linear-gradient(178deg, #F2823C 0%, #DE5A28 52%, #C9481C 100%);
    box-shadow: 0 6px 14px rgba(110,96,73,.28);
  }
  .wordmark .hyphen s {
    position: absolute; left: 3px; right: 3px; top: 3px; height: 4px;
    border-radius: 2px; background: rgba(246,211,172,.88); text-decoration: none;
  }

  .tagline { margin-top: 26px; font-size: 26px; font-weight: 400;
             color: #756E60; letter-spacing: .001em; }
  .tagline b { color: #3A414B; font-weight: 500; }
</style>
</head>
