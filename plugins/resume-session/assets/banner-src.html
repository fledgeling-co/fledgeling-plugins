<style>
  * { margin: 0; box-sizing: border-box; }

  /* The ground is the icon's own cushion: the same two stops, the same key. */
  body {
    width: 1600px;
    height: 520px;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(120% 220% at 13% 10%,
        #F3ECE2 0%,
        #EEE3D1 52%,
        #DBCCB7 100%);
    font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    color: #2C2F33;
  }

  .lockup {
    position: absolute;
    left: 92px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 60px;
    z-index: 2;
  }

  .icon {
    width: 300px;
    height: 300px;
    /* This carried filter: drop-shadow(11px 13px 34px rgba(62, 45, 31, 0.26)),
       which this engine accepts and never paints -- measured 19 Aug against a
       fixture, where a hard black shadow at a 30px offset read pure white here
       and solid black as a box-shadow. So the shipped banner has no contact
       shadow under the tile and never did. Removed rather than reimplemented:
       the banner's verdict was signed against these pixels, and a real shadow
       moves them. banner-verdict.md records it as owed. */
  }

  .wordmark {
    font-size: 88px;
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1.02;
    white-space: nowrap;
  }

  .wordmark .hyphen { color: #CA5124; }

  .essence {
    margin-top: 18px;
    max-width: 640px;
    font-size: 25px;
    font-weight: 400;
    line-height: 1.42;
    color: #6D7179;
  }

  .essence b { color: #2C2F33; font-weight: 500; }

  /* The fore-edge crop. It fades out into the ground on both sides rather than
     being cut by the frame. */
  .detail {
    position: absolute;
    left: 1178.0px;
    top: 0;
    width: 396.0px;
    height: 520px;
    opacity: 0.92;
    mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, #000 24%, #000 66%, rgba(0,0,0,0) 100%);
    -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, #000 24%, #000 66%, rgba(0,0,0,0) 100%);
  }

  .board, .block, .leaf, .ribbon { position: absolute; }

  .board {
    left: 0;
    width: 396.0px;
    height: 38.5px;
    background: linear-gradient(to bottom, #2B2E33, #1E2125);
  }

  .block {
    left: 0;
    width: 396.0px;
    top: 212.5px;
    height: 95.1px;
    background: linear-gradient(to bottom, #BEA585, #A18665);
  }

  .leaf {
    width: 396.0px;
    height: 3px;
    border-radius: 1.5px;
    background: #876C4E;
  }

  .ribbon {
    left: 182.2px;
    top: 250.5px;
    width: 124.5px;
    height: 169.5px;
    background: linear-gradient(to bottom, #8A2F11 0%, #A23E1A 46%, #CA5124 62%, #B2431B 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 81%, 0 100%);
  }
</style>
