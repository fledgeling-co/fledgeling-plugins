<meta charset="utf-8">
<title>motion-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Values lifted from assets/build_icon.py and named where they land.
     LIGHT_ANGLE_DEG 118: LX +0.469, LY +0.883, so the ground falls toward 152deg and
     every shadow is offset right and down. Ground GROUND_HI / GROUND_MID / GROUND_EDGE,
     vignette VIGNETTE at VIGNETTE_A 0.22, shadow ink SHADOW #3A3126, accent ACCENT
     #EA4A24 with ACCENT_CORE #FFD7B0 and ACCENT_DEEP #7A2008. Ghost frost GHOST_HI
     #E9E5DD to GHOST_LO #9C968B at GHOST_ALPHA. Family face Instrument Sans, as on the
     ux-craft and design-craft banners.

     The strip on the right is the icon's idea laid flat: one capsule at five moments
     of a 0.8 s move, sampled every 0.2 s through a quadratic ease-out
     (x = 1 - (1 - t)^2). A 96 px capsule on a 520 px run travels 424 px, so its left
     edge sits at 0, 186, 318, 398, 424: the gaps shrink as it arrives, and the ticks on
     the run show it. Older frames are fainter; only the landed frame carries the accent. */

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(120% 320% at 40% 30%, rgba(255,255,255,.86) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(120% 175% at 50% 50%, rgba(139,127,102,0) 54%, rgba(139,127,102,.22) 100%),
      linear-gradient(152deg, #FDFBF6 0%, #F4EFE3 56%, #E1D9C8 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    position: relative; overflow: hidden;
  }
  .lockup { position: absolute; left: 96px; top: 140px; display: flex; align-items: center; gap: 48px; }
  .tile { position: absolute; inset: 12px; border-radius: 48px; box-shadow: 8px 16px 18px rgba(58,49,38,.18); }  /* light axis: right and down; warm ink so it does not read olive */
  .icon { position: relative; width: 240px; height: 240px; display: block; }
  .text { width: 640px; }
  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #1E1B16; }
  p { margin-top: 24px; font-size: 26px; line-height: 1.38; font-weight: 400; color: #4A443A; }
  p b { color: #C2391A; font-weight: 500; }          /* ACCENT lifted for text-size contrast on porcelain */

  .strip { position: absolute; left: 1060px; top: 196px; width: 450px; height: 130px; }
  .stamp { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 17px; fill: #7A7062; }
</style>
