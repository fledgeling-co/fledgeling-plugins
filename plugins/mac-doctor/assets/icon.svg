  <g transform="translate(512,512) scale(0.93) translate(-512,-512)">
    <!-- recessed track -->
    <circle cx="512" cy="512" r="292" fill="none"
            stroke="url(#track)" stroke-width="108"/>
    <circle cx="512" cy="512" r="292" fill="none"
            stroke="#B9B1A0" stroke-opacity="0.35" stroke-width="108"
            style="filter:none"/>

    <!-- the filled capacity, 290 degrees of graphite gel -->
    <g filter="url(#ringShadow)">
      <path d="M 764.9 366.0 A 292 292 0 1 1 562.7 224.4" fill="none" stroke="url(#ring)"
            stroke-width="108" stroke-linecap="butt"/>
    </g>
    <!-- Edge catches as CONCENTRIC strokes, not a displaced copy. A ring lit
         from above catches light along its outer top curve and bounces a
         weaker line along the inner curve; the raster take reads richer
         largely because it has both. Clipped to the filled arc so the empty
         track stays matte. -->
    <path d="M 807.3 341.5 A 341.0 341.0 0 1 1 571.2 176.2" fill="none"
          stroke="url(#edgeTop)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 723.3 390.0 A 244.0 244.0 0 1 1 554.4 271.7" fill="none"
          stroke="url(#edgeInner)" stroke-width="7" stroke-linecap="round"/>

    <!-- the wedge that came back -->
    <g transform="translate(67.7,-96.7)" filter="url(#emberShadow)">
      <path d="M 567.7 225.4 A 292 292 0 0 1 762.3 361.6" fill="none" stroke="url(#ember)"
            stroke-width="108" stroke-linecap="round"/>
      <path d="M 567.7 225.4 A 292 292 0 0 1 762.3 361.6" fill="none" stroke="url(#emberRim)"
            stroke-width="37" stroke-linecap="round"
            transform="translate(0,-28)" opacity="0.75"/>
    </g>
  </g>
</g>
</svg>
