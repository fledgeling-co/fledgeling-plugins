<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture — control for the divider-gutter probe</title>
<!--
  The control. Identical markup and identical rules; the only change is that
  each cell carries 32px of padding, so the rule sits in a gap rather than
  beside the words.

  Expected: probeDividerProximity() returns 0 violations, 0 crossings.

  A probe that fires here is measuring element boxes again, or its threshold
  has drifted above what a real page can carry. A probe that fires on neither
  this nor divider-gutter.html never ran — check that probes.js was injected
  before runAll(), not after.
-->
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 40px;
         background: #fbfaf7; color: #16150f; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr);
         border-top: 1px solid #ddd8c9; }
  .row > div { border-left: 1px solid #cfcabb; padding-left: 32px; padding-right: 32px; }
  .label { font: 600 11px/1.2 ui-monospace, monospace; letter-spacing: .08em;
           color: #5d5a4e; }
  .big { font: 700 34px/1 ui-monospace, monospace; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em;
       color: #777; margin: 0 0 8px; }
</style>
</head>
<body>

<h2>The same row, spaced</h2>
<div class="row">
  <div>
    <p class="label">WEEKLY WINDOW</p>
    <p class="big">3.48B raw</p>
    <p>340 observations, 28 windows</p>
  </div>
  <div>
    <p class="label">CACHE READ SHARE</p>
    <p class="big">95.4%</p>
    <p>of every token sent</p>
  </div>
  <div>
    <p class="label">QUOTA UNIT</p>
    <p class="big">not established</p>
    <p>two lines lean one way; neither settles it</p>
  </div>
</div>

</body>
</html>
