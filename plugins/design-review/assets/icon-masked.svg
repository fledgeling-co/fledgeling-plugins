<!--
  design-review app icon master. Direction "Press Proof" (porcelain precision register).
  Full-bleed 1024 artwork; the squircle mask and drop shadow are the system's, never baked here.
  Four layers map 1:1 onto Icon Composer: #bg / #mid / #fg / #highlight.
  v2: the frosted glass-overlay material from the C2 raster take, rebuilt as layers. The
  front slab is a poured milky frost defined by its edge and its shadow rather than by its
  fill, with a deeper slate plane behind it reading through as a darker step. The column
  drift and the silhouette break stay, so the artwork still names the subject.
-->
<defs>
  <radialGradient id="tile" cx="43%" cy="32%" r="79%">
    <stop offset="0" stop-color="#FEFEFF"/>
    <stop offset=".50" stop-color="#F7FAFC"/>
    <stop offset="1" stop-color="#E6ECF3"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="45%" r="70%">
    <stop offset=".50" stop-color="#54677D" stop-opacity="0"/>
    <stop offset="1" stop-color="#54677D" stop-opacity=".12"/>
  </radialGradient>

  <linearGradient id="rearFill" x1="187" y1="244" x2="667" y2="604" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A9BCD0"/>
    <stop offset=".45" stop-color="#8AA3BD"/>
    <stop offset="1" stop-color="#6B88A7"/>
  </linearGradient>
  <linearGradient id="frostFill" x1="260" y1="296" x2="660" y2="656" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FBFDFF"/>
    <stop offset=".44" stop-color="#E3EBF4"/>
    <stop offset="1" stop-color="#BFCFE1"/>
  </linearGradient>
  <linearGradient id="frostRim" x1="235" y1="296" x2="715" y2="656" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset=".34" stop-color="#FFFFFF" stop-opacity=".42"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".14"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="296" x2="0" y2="448" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".78"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rearSheen" x1="0" y1="244" x2="0" y2="332" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".52"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="discFill" x1="0" y1="482" x2="0" y2="706" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF7C5D"/>
    <stop offset=".46" stop-color="#EC3F26"/>
    <stop offset="1" stop-color="#BC2814"/>
  </linearGradient>
  <linearGradient id="armFill" x1="0" y1="408" x2="0" y2="780" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F35839"/>
    <stop offset=".5" stop-color="#E33B21"/>
    <stop offset="1" stop-color="#C22A16"/>
  </linearGradient>

  <filter id="blurS" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="blurM" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blurL" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="blurXL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>

  <clipPath id="frostClip"><rect x="235" y="296" width="480" height="360" rx="54"/></clipPath>
  <clipPath id="rearClip"><rect x="187" y="244" width="480" height="360" rx="54"/></clipPath>
</defs>

<!-- ============ bg: porcelain cushion tile ============ -->
<g id="bg">
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="230" fill="none" stroke="#66768A" stroke-opacity=".10" stroke-width="6"/>
  <rect x="7.5" y="7.5" width="1009" height="1009" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity=".60" stroke-width="3"/>
</g>

<!-- ============ mid: the glass overlay, with the column drift held inside it ============ -->
<g id="mid">
  <!-- the plane behind: deeper slate glass, reading through the frost as a darker step -->
  <rect x="187" y="258" width="480" height="360" rx="54" fill="#2C3C54" opacity=".20" filter="url(#blurL)"/>
  <rect x="187" y="244" width="480" height="360" rx="54" fill="url(#rearFill)"/>
  <rect x="187" y="244" width="480" height="92" fill="url(#rearSheen)" clip-path="url(#rearClip)"/>
  <rect x="187" y="244" width="480" height="360" rx="54" fill="none" stroke="#3E5A78" stroke-opacity=".38" stroke-width="2"/>

  <!-- the poured frost slab in front: defined by its edge and its shadow, not by its fill -->
  <rect x="235" y="316" width="480" height="360" rx="54" fill="#2C3C54" opacity=".24" filter="url(#blurL)"/>
  <rect x="235" y="296" width="480" height="360" rx="54" fill="url(#frostFill)" opacity=".70"/>

  <g clip-path="url(#frostClip)">
    <!-- the shared rail everything below is measured against -->
    <rect x="271" y="332" width="408" height="30" rx="10" fill="#274468" opacity=".26"/>
    <!-- left column, sitting true on the rail -->
    <rect x="271" y="394" width="188" height="180" rx="15" fill="#2C4C74" opacity=".22"/>
    <!-- ghost: where the right column should have landed -->
    <rect x="491" y="394" width="188" height="180" rx="15" fill="#2C4C74" opacity=".11"/>
    <!-- and where it actually landed: 44px low, 12px right, running past the margin.
         The band where ghost and column cross is the authored overlap, and it is the
         defect the mark has been set down on. -->
    <rect x="503" y="438" width="188" height="180" rx="15" fill="#2C4C74" opacity=".22"/>
  </g>

  <rect x="235" y="296" width="480" height="360" rx="54" fill="none" stroke="#5C7B9C" stroke-opacity=".46" stroke-width="2.5"/>
  <rect x="236.5" y="297.5" width="477" height="357" rx="53" fill="none" stroke="url(#frostRim)" stroke-width="3.5"/>
</g>

<!-- ============ fg: the registration mark, set down on the broken rail ============ -->
<g id="fg">
  <circle cx="651" cy="594" r="156" fill="#EC3F26" opacity=".08" filter="url(#blurXL)"/>

  <g opacity=".30" filter="url(#blurM)">
    <rect x="627" y="422" width="48" height="372" rx="13" fill="#411C12"/>
    <rect x="479" y="584" width="372" height="48" rx="13" fill="#411C12"/>
    <circle cx="653" cy="608" r="112" fill="#411C12"/>
  </g>

  <g opacity=".94">
    <rect x="627" y="408" width="48" height="372" rx="13" fill="url(#armFill)"/>
    <rect x="465" y="570" width="372" height="48" rx="13" fill="url(#armFill)"/>
    <circle cx="651" cy="594" r="112" fill="url(#discFill)"/>
    <circle cx="651" cy="594" r="74" fill="none" stroke="#FDFDFE" stroke-opacity=".94" stroke-width="12"/>
    <rect x="643.5" y="482" width="15" height="224" rx="5" fill="#FDFDFE" opacity=".94"/>
    <rect x="539" y="586.5" width="224" height="15" rx="5" fill="#FDFDFE" opacity=".94"/>
  </g>
</g>

<!-- ============ highlight: one soft top light; droppable under tinting ============ -->
<g id="highlight">
  <rect x="235" y="296" width="480" height="152" fill="url(#sheen)" clip-path="url(#frostClip)"/>
  <ellipse cx="622" cy="522" rx="72" ry="38" fill="#FFFFFF" opacity=".22" filter="url(#blurS)"/>
</g>
</g></svg>