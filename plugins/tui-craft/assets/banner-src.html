<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  tui-craft README banner, 1600x520, rendered at 2x to 3200x1040 by
  create-skill/scripts/render_banner.py (which asserts those dimensions rather
  than trusting the request).

  Every number here is READ OUT OF the icon's own build script,
  ../assets/build_icon.py, rather than matched by eye. That script is the
  authority because the icon is a hand-authored layered master with named
  constants, so there is nothing to estimate:

    CELL_W, CELL_H      56, 68     the character cell. This is the subject of the
                                   whole plugin: the ratio 56:68 is what a
                                   terminal cell is, and it is preserved here
                                   exactly rather than rounded to something
                                   tidier.
    DEV_X, DEV_Y        168, 236   the device's top-left in the icon's 1024 space
    GRID_PAD_X, PAD_Y   40, 46     so the icon's grid origin is 208, 282
    device gradient     (0.12,0) -> (0.9,1)   the icon's explicit light model.
                                   Normalised, the lit-to-shadow axis is
                                   (0.615, 0.788), which is the direction the
                                   bench light ramp runs. It is NOT create-skill's
                                   vector; that banner's icon is lit from
                                   further round and copying its endpoints is
                                   exactly the re-eyeballing this comment exists
                                   to prevent.
    GRID_LINE           #8A94A3    at 0.22 opacity inside the device
    ACCENT              #E8542A    spent on one glyph and nothing else
    TEXT_DIM            #78838F

  The signature move: the icon's character grid LEAVES ITS TILE and rules the
  whole bench, at the icon's own cell size and phase-locked to its own grid
  origin. The icon renders at 300px of a 1024 master, so the scale is 0.29297
  and a cell out here is 16.41 x 19.92. The lattice is therefore not a
  decorative grid that happens to look similar; it is the same grid, continued.
  Change the icon's cell or its placement and the script re-derives this.

  The grid is drawn at 0.13 rather than the icon's 0.22 because inside the icon
  it sits on a near-black device (#171B21 to #39404A) and out here it sits on
  porcelain (#FDFCFA to #D8D3C9). Holding the number would have held the
  opacity and thrown away the contrast relationship, which is the thing that
  was actually being matched.

  The accent appears once, in the one place it does in the icon: a single glyph
  occupying TWO cells. Out on the bench it is that glyph at the same scale,
  sitting on two cells of the visible lattice with the boundary between them
  drawn, so the banner restates the plugin's whole thesis in its only warm
  element -- one character, two cells. The icon's caliper is deliberately NOT
  repeated here; see the note at the drawing code for what happened when it was.

  Ground is the porcelain register the marketplace uses by default; the dark
  register belongs to the sibling trawl.

  Type is Martian Mono. A mono is the honest register for a plugin about the
  character cell, and this one is drawn for it: its glyphs are cut to sit
  squarely in a fixed advance rather than a proportional one, so the wordmark is
  itself on a lattice. Three siblings use monos (IBM Plex Mono, JetBrains Mono);
  neither is this, and no sibling uses Martian.
-->
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background: #EFEBE3;
    font-family: "Martian Mono", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  svg.bench { position: absolute; inset: 0; }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 92px; }
  .icon { width: 300px; height: 300px; flex: none;
          /* inert in this engine, removed: drop-shadow(0 20px 44px rgba(42, 50, 62, .30)) */ }

  .wordmark { font-size: 80px; font-weight: 700; letter-spacing: -0.055em;
              line-height: 1; color: #1B2028; white-space: nowrap; }
  .tagline { margin-top: 30px; font-size: 22px; font-weight: 400;
             letter-spacing: -0.028em; color: #5F6874; white-space: nowrap; }
  .tagline b { color: #262C35; font-weight: 500; }
</style>
</head>
<body>
  <svg class="bench" width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- One soft key across the bench: the icon's own light model extended. A
           LINEAR ramp along the measured axis, not a radial hotspot, because a
           radial placed anywhere near a 1600x520 frame throws a divergent field
           whose direction across the frame is its own geometry rather than the
           azimuth it was given. Endpoints are set by the script from the icon's
           device gradient; do not hand-place them. -->
      <linearGradient id="key" gradientUnits="userSpaceOnUse">
        <stop offset="0"    stop-color="#FDFCFA"/>
        <stop offset="0.46" stop-color="#EFEBE3"/>
        <stop offset="1"    stop-color="#D8D3C9"/>
      </linearGradient>
      <!-- What the icon's own accent throws onto the porcelain past its tile.
           The icon glows its accent at the lit glyph, so the spill is centred on
           where that glyph projects to out here, not on the tile's middle. -->
      <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#FF8A5E" stop-opacity=".20"/>
        <stop offset="0.44" stop-color="#FF8A5E" stop-opacity=".07"/>
        <stop offset="1"    stop-color="#FF8A5E" stop-opacity="0"/>
      </radialGradient>
      <!-- The second glyph's own bounce, one notch weaker than the icon's. -->
      <radialGradient id="bounce" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#FF8A5E" stop-opacity=".30"/>
        <stop offset="0.5"  stop-color="#FF8A5E" stop-opacity=".10"/>
        <stop offset="1"    stop-color="#FF8A5E" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="glyph" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#F4794A"/>
        <stop offset="1" stop-color="#E8542A"/>
      </linearGradient>
    </defs>

    <rect id="ground" width="1600" height="520" fill="url(#key)"/>
    <g id="lattice"></g>
    <g id="marks"></g>
  </svg>

  <div class="lockup">
    <!-- The icon is inlined as a data URI, not referenced as icon.png.
           Measured on Obscura 2026-08-17: a file:// page does not load its
           file:// image subresources -- the <img> reports complete:false and
           naturalWidth:0, the banner renders with a hole where the icon goes,
           and nothing errors. Regenerate with:
             python3 -c "import base64,io;from PIL import Image;\
               im=Image.open('icon.png').convert('RGBA').resize((600,600));\
               b=io.BytesIO();im.save(b,'PNG',optimize=True);\
               print(base64.b64encode(b.getvalue()).decode())"
           600px is 300 CSS px at deviceScaleFactor 2, so it is exact. -->

    <div>
      <div class="wordmark">tui-craft</div>
      <div class="tagline">A terminal is a grid of cells. <b>Design on it, then measure it.</b></div>
    </div>
  </div>

<script>
// ---- read straight off the icon's build script ------------------------------
const ICON = {
  S: 1024,
  CELL_W: 56, CELL_H: 68,
  DEV_X: 168, DEV_Y: 236,
  GRID_PAD_X: 40, GRID_PAD_Y: 46,
  // device linear gradient (x1,y1)->(x2,y2), the icon's lit-to-shadow axis
  LIGHT: [0.12, 0, 0.9, 1],
  GRID_LINE: "#8A94A3",
  ACCENT_GLOW: "#E8542A",
  // the lit glyph inside the icon: column 4, row 3, two cells wide
  LIT: { col: 4, row: 3, span: 2 },
};

const W = 1600, H = 520;
const ICON_PX = 300, ICON_LEFT = 112;
const ICON_TOP = (H - ICON_PX) / 2;
const K = ICON_PX / ICON.S;                    // 0.29297

// the icon's grid origin, projected into banner space
const gx0 = ICON_LEFT + (ICON.DEV_X + ICON.GRID_PAD_X) * K;
const gy0 = ICON_TOP  + (ICON.DEV_Y + ICON.GRID_PAD_Y) * K;
const cw = ICON.CELL_W * K, ch = ICON.CELL_H * K;

// ---- the key, along the icon's own light axis -------------------------------
const [lx1, ly1, lx2, ly2] = ICON.LIGHT;
let ax = lx2 - lx1, ay = ly2 - ly1;
const alen = Math.hypot(ax, ay); ax /= alen; ay /= alen;   // (0.615, 0.788)
const half = 640, cx = W / 2, cy = H / 2;
const g = document.getElementById("key");
g.setAttribute("x1", (cx - ax * half).toFixed(1));
g.setAttribute("y1", (cy - ay * half).toFixed(1));
g.setAttribute("x2", (cx + ax * half).toFixed(1));
g.setAttribute("y2", (cy + ay * half).toFixed(1));

// ---- the lattice: the icon's grid, continued and phase-locked ---------------
// Phase is taken from gx0/gy0 so a rule out here lands where a rule inside the
// icon would if the device had no edge.
const lat = document.getElementById("lattice");
const ns = "http://www.w3.org/2000/svg";
const line = (x1, y1, x2, y2, o) => {
  const l = document.createElementNS(ns, "line");
  l.setAttribute("x1", x1.toFixed(2)); l.setAttribute("y1", y1.toFixed(2));
  l.setAttribute("x2", x2.toFixed(2)); l.setAttribute("y2", y2.toFixed(2));
  l.setAttribute("stroke", ICON.GRID_LINE);
  l.setAttribute("stroke-width", "1");
  l.setAttribute("stroke-opacity", o);
  lat.appendChild(l);
};
// Fade the lattice out toward the right so the wordmark sits on quiet ground,
// and hold it strongest near the tile it comes from.
const fade = x => 0.13 * Math.max(0, 1 - Math.max(0, x - 380) / 1500);
for (let x = gx0 % cw; x < W; x += cw) line(x, 0, x, H, fade(x).toFixed(3));
for (let y = gy0 % ch; y < H; y += ch) {
  // horizontal rules carry the same left-weighted fade, sampled at their middle
  line(0, y, W, y, (0.10 * 0.75).toFixed(3));
}

// ---- the one warm element: a glyph two cells wide, with its caliper ---------
// Same construction as the icon's, at the same scale, out on the open bench and
// running off the right edge the way create-skill's second vessel does.
const marks = document.getElementById("marks");
const litCol = Math.round((1418 - gx0) / cw);          // near the right edge
const litRow = Math.round((418 - gy0) / ch);   // clear of the lockup
const lx = gx0 + litCol * cw, ly = gy0 + litRow * ch;
const lw = ICON.LIT.span * cw;

const el = (name, attrs) => {
  const e = document.createElementNS(ns, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  marks.appendChild(e);
  return e;
};

// bounce onto the porcelain under it
el("rect", { x: lx - lw * 1.9, y: ly - ch * 1.9, width: lw * 4.8, height: ch * 4.8,
             fill: "url(#bounce)" });
// The glyph itself, filling exactly two cells of the lattice, and nothing else.
//
// The first version carried the icon's caliper out here too, on the reasoning
// that the banner should restate the icon's construction. Rendered and looked
// at, it did not read: at the icon's true cell scale a cell is 16.4 x 19.9px,
// and a caliper drawn across two of them resolves as a small orange cup rather
// than as a measurement. Enlarging it would have fixed the legibility by
// breaking the one claim the element is making -- that this is the icon's grid
// at the icon's own size. So the caliper is gone and the lattice does that job:
// the block sits exactly on two cells of a grid the viewer can see, which is
// the same statement with nothing extra drawn.
el("rect", { x: lx.toFixed(2), y: (ly + ch * 0.14).toFixed(2),
             width: lw.toFixed(2), height: (ch * 0.72).toFixed(2),
             rx: (ch * 0.09).toFixed(2), fill: "url(#glyph)" });
// the cell boundary the glyph straddles, so the pair reads as two cells and not
// as one wide box
el("line", { x1: (lx + cw).toFixed(2), y1: (ly + ch * 0.14).toFixed(2),
             x2: (lx + cw).toFixed(2), y2: (ly + ch * 0.86).toFixed(2),
             stroke: "#FFF3EC", "stroke-width": "1",
             "stroke-opacity": "0.42" });

// the icon's own accent spill, continuing past the edge of its tile, centred on
// where the icon's lit glyph projects to rather than on the tile's middle
const sx = ICON_LEFT + (ICON.DEV_X + ICON.GRID_PAD_X + (ICON.LIT.col + 1) * ICON.CELL_W) * K;
const sy = ICON_TOP + (ICON.DEV_Y + ICON.GRID_PAD_Y + (ICON.LIT.row + 0.5) * ICON.CELL_H) * K;
const spill = document.createElementNS(ns, "rect");
spill.setAttribute("x", (sx - 300).toFixed(1));
spill.setAttribute("y", (sy - 300).toFixed(1));
spill.setAttribute("width", "600"); spill.setAttribute("height", "600");
spill.setAttribute("fill", "url(#spill)");
document.getElementById("ground").after(spill);

// Expose the derived numbers so the renderer can assert them rather than
// trusting that this script ran.
window.__banner = { K, gx0, gy0, cw, ch, axis: [ax, ay], litCol, litRow, lx, ly, lw };
</script>
