<!doctype html>
<meta charset="utf-8">
<title>mac-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Every value below is lifted from assets/build_icon.py and named in the comment
     that carries it. Nothing here was sampled off a sibling banner.

     Engine facts this composition works around, measured 2026-08-19:
       filter: drop-shadow() paints nothing here, so the tile's contact shadow is a
         pair of box-shadows on a transparent backing box, which is also the icon's
         own two-part contact shadow: a wide shallow POOL and a narrow SEAT;
       an oblique projection in CSS means a transform on a painted box, which this
         engine renders with tile seams, so the sash is inline SVG, where the icon's
         own P() basis is a coordinate change rather than a raster pass. */

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }

  body {
    /* GROUND_HI / GROUND_MID / GROUND_LO, the measured 0.07 L fall across the
       bench, ramped along the key. KEY_A (170, 40) to KEY_B (880, 920) gives a
       shade direction of (0.628, 0.778), so the ground falls at
       atan2(0.628, -0.778) = 141deg. The highlight sits at the ground gradient's
       own cx 0.34 / cy 0.02, and the vignette is VIGNETTE at its own 0.30, offset
       to its own cx 0.42 / cy 0.36. */
    background:
      radial-gradient(128% 330% at 34% 2%, rgba(255,255,255,.90) 0%, rgba(255,255,255,0) 54%),
      radial-gradient(118% 172% at 42% 36%, rgba(196,184,153,0) 58%, rgba(196,184,153,.30) 100%),
      linear-gradient(141deg, #FDFCF9 0%, #F3EFE7 52%, #E7E1D5 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }

  /* ---------------------------------------------------------------- lockup */
  /* The icon's own contact shadow, which is measured rather than invented: a WIDE
     SHALLOW pool in POOL #A99775 at -0.058 L, plus a NARROW SEAT in SEAT_DARK
     #6E5C3E at -0.114. Both thrown along the key's (0.628, 0.778). Not a dark
     offset blob, which is the thing apple-18 was measured to disprove. */
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px;
          border-radius: 58px 58px 58px 58px;
          box-shadow: 25px 31px 48px rgba(169,151,117,.62),
                      10px 13px 16px rgba(110,92,62,.34); }
  .icon { width: 280px; height: 280px; flex: none; }

  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1;
       color: #2A2116; }                                  /* TOOL_FRONT */
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400;
       color: #5F5039; max-width: 600px; }                /* MITRE_DARK */
  p b { color: #2A2116; font-weight: 500; }

  /* ------------------------------------------------------ the registered line
     Emitted through build_icon.py's own P(), quad(), chamfered(), wall(), poly()
     and lin(), so the cavalier oblique is the icon's own basis: E1 (1, -0.055) for
     the sash's width axis and E2 (-0.075, 0.955) for the depth, untouched, because
     a basis is not a length. Every plan length is the icon's constant at one scale
     factor of 0.50: UW 500, VH 470, STILE 116, RAIL_TOP 96, RAIL_BOT 118, WALL 52,
     CORNER 16, REBATE 26, and the gauge's STOCK_UD 106, STOCK_H 66, BEAM_W 76,
     BEAM_H 30, SCREW_R 34.

     The mark is the point: PIN_U 58 of the stile's 116, LINE_V0 143 to LINE_V1 442,
     LINE_W 46. Its position is not chosen. The stock is pressed against the
     reference edge at u = 0 and the pin cuts where the beam says, so the line is a
     consequence of the registration rather than a decision about where a line
     looks good. Slide the stock off the edge and the mark means nothing, which is
     what a token value does when its provenance mark is dropped.

     One declared deviation, and only one: BEAM_U0 is -400 in the icon so the tail
     runs off the tile and is cut by the mask, because a tail that stops just inside
     the mask reads as an accident. A banner has no mask there, so the tail is cut
     back to just past the stock instead. */
  .sash { position: absolute; left: 1104px; top: 78px; }

  /* mac-craft's thesis in its own notation: a value carries where it came from, and
     (specified)(canon) is not interchangeable with (estimated)(inferred). The
     figures are the icon's plan units, not the banner's scaled ones. */
  .prov { position: absolute; left: 1146px; top: 436px;
          font: 500 18px/1 "IBM Plex Mono", ui-monospace, monospace;
          color: #5F5039; letter-spacing: .045em; }
  .prov em { font-style: normal; color: #93300B; }        /* ACCENT_DEEP */
</style>
