<meta charset="utf-8">
<title>home-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The fledgeling banner system (duo-craft's banner-src.html): Instrument Sans wordmark, IBM Plex
     Mono for measured labels, porcelain ground ramp from build_icon.py, one ember accent.
     The tiles on the right are the skill's central count: CarPlay's 11 categories, of which the
     2 in ember (audio, video) reach HomeView as the app itself; any app reaches it as a widget. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(128% 330% at 34% 2%, rgba(255,255,255,.90) 0%, rgba(255,255,255,0) 54%),
      radial-gradient(118% 172% at 42% 36%, rgba(196,184,153,0) 58%, rgba(196,184,153,.30) 100%),
      linear-gradient(141deg, #FDFCF9 0%, #F3EFE7 52%, #E7E1D5 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px; border-radius: 58px;
          box-shadow: 18px 24px 40px rgba(150,132,104,.30), 6px 9px 12px rgba(94,79,58,.20); }
  .icon { width: 280px; height: 280px; flex: none; position: relative; }
  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #2A2320; }
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400; color: #5E4F3A; max-width: 560px; }
  p b { color: #2A2320; font-weight: 500; }
  .lab { position: absolute; font: 500 17px/1 "IBM Plex Mono", ui-monospace, monospace; color: #5E4F3A; letter-spacing: .04em; }
  .lab em { font-style: normal; color: #B8431E; }
  /* the count the skill turns on: 11 CarPlay categories, the 2 that reach HomeView as the app in ember */
  .grid { position: absolute; left: 1112px; top: 150px; display: grid; grid-template-columns: repeat(6, 52px); gap: 12px; }
  .c { width: 52px; height: 52px; border-radius: 14px; background: #E6DFD3; border: 4px solid #4B423B;
       box-shadow: 6px 8px 14px rgba(150,132,104,.26); }
  .c.on { background: #E9562A; border-color: #4B423B; box-shadow: 0 0 16px rgba(233,86,42,.35), 6px 8px 14px rgba(150,132,104,.26); }
</style>
