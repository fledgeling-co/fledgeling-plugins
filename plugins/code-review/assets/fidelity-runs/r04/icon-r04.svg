  <g id="shadow">
    <!-- Light through the opening, reaching the porcelain past the slab's foot.
         Drawn before the body so the body occludes it, which is what makes the
         glow read as coming from underneath rather than as painted on top. -->
    <rect x="384" y="724" width="504" height="330" fill="url(#bleed)"/>
    <path d="M262.0,192.0 H762.0 A104.0,104.0 0 0 1 866.0,296.0 V804.0 A104.0,104.0 0 0 1 762.0,908.0 H262.0 A104.0,104.0 0 0 1 158.0,804.0 V296.0 A104.0,104.0 0 0 1 262.0,192.0 Z" fill="#3A2A18"
