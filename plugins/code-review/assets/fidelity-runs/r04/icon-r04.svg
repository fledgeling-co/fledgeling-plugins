      <path d="M598.0,306.0 H674.0 A46.0,46.0 0 0 1 720.0,352.0 V680.0 A46.0,46.0 0 0 1 674.0,726.0 H598.0 A46.0,46.0 0 0 1 552.0,680.0 V352.0 A46.0,46.0 0 0 1 598.0,306.0 Z" fill="url(#floor)"/>
