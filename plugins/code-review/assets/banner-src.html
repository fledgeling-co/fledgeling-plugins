<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Every colour below is lifted from build_icon.py rather than eyeballed off a
     sibling banner: GROUND_TOP/GROUND_BOT, SLAB_TOP/MID/BOT, the ACCENT_* ramp
     and SEAT_EDGE are the master's own constants, and the light is keyed to the
     same top-left source at (34%, 26%). The face is Instrument Sans, the set
     wordmark, linked rather than named locally, so a re-render on another
     machine cannot quietly substitute a different one. */

  * { margin: 0; box-sizing: border-box; }

  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background:
      radial-gradient(88% 150% at 34% 26%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 58%),
      radial-gradient(112% 168% at 50% 46%, rgba(122,101,68,0) 52%, rgba(122,101,68,.14) 100%),
      linear-gradient(176deg, #FBF7F0 0%, #F1EADD 54%, #DED4C2 100%);
    font-family: "Instrument Sans", sans-serif;
  }

  /* The icon's device, found again on the far side of the sheet: a ledger whose
     rows run up to a column that has been cut clean out of it, and carry on past
     the gap. The rows on the right are the point. A ledger that simply stopped
     would be a queue held at a gate; a ledger that resumes on the other side is
     a table with a column missing, which is what the coverage ledger prints. */
  .ledger { position: absolute; left: 0; top: 0; }

  .rail {
    position: absolute; height: 26px; border-radius: 13px;
    background: linear-gradient(178deg, #45464B 0%, #313339 58%, #23242A 100%);
    box-shadow: 0 8px 17px rgba(110,96,73,.20), 0 2px 5px rgba(65,55,42,.26);
  }
  .rail i {
    position: absolute; left: 13px; right: 13px; top: 2px; height: 5px;
    border-radius: 3px; background: rgba(255,243,226,.20);
  }

  /* The cut. Two nested boxes, exactly as the master builds it: the outer is the
     slab's own thickness exposed by the cut, the inner is the porcelain the slab
     stands on, showing through. */
  .cut {
    position: absolute; left: 1316px; top: 77px;
    width: 100px; height: 244px; border-radius: 34px;
    background: linear-gradient(155deg, #F09A63 0%, #D4703A 34%, #B85326 70%, #93380E 100%);
    box-shadow: 0 14px 28px rgba(110,96,73,.28), 0 4px 8px rgba(65,55,42,.30);
  }
  /* the accent stands on the ground, so it borrows a boundary of its own deep
     value rather than relying on luminance alone */
  .cut u {
    position: absolute; inset: 0; border-radius: 34px;
    border: 3px solid rgba(18,19,22,.42);
  }
  .cut s {
    position: absolute; left: 22px; right: 22px; top: 7px; height: 6px;
    border-radius: 3px; background: rgba(255,230,210,.62); text-decoration: none;
  }
  .cut b {
    position: absolute; inset: 15px; border-radius: 20px;
    background:
      radial-gradient(72% 46% at 68% 84%, rgba(196,98,45,.30) 0%, rgba(196,98,45,0) 100%),
      linear-gradient(150deg, #CCBEA3 0%, #E9DDC8 52%, #F6ECD8 100%);
  }
  /* the light that got through, landing on the porcelain past the ledger's foot */
  .throughlight {
    position: absolute; left: 1256px; top: 302px; width: 220px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 30%, rgba(196,98,45,.34) 0%, rgba(196,98,45,0) 100%);
  }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
             display: flex; align-items: center; gap: 62px; }
  .icon { width: 288px; height: 288px; display: block; }
  /* the icon's own contact shadow, as a backing box, because this engine
     accepts filter: drop-shadow and never paints it */
  .iconseat { position: relative; width: 288px; height: 288px; }
  .iconseat span {
    position: absolute; left: 26px; right: 26px; bottom: 6px; height: 54px;
    border-radius: 40px; background: rgba(110,96,73,.28);
    box-shadow: 0 18px 34px 10px rgba(110,96,73,.24);
  }
  .iconseat img { position: absolute; inset: 0; }

  .wordmark { font-size: 92px; font-weight: 700; letter-spacing: -.035em;
               line-height: 1; color: #2C313A; white-space: nowrap; }

  .tagline { margin-top: 26px; font-size: 26px; font-weight: 400;
              color: #756E60; letter-spacing: .001em; }
  .tagline b { color: #3A414B; font-weight: 500; }
</style>
