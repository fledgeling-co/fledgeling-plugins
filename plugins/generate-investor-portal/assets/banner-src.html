<!doctype html>
<meta charset="utf-8">
<title>generate-investor-portal banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<!--
  Derived from assets/build_icon.py, which is "The Strongroom, Open". Every value
  below is one of its named constants, cited where it is used:

    KEY            ((150,40),(900,990))  one key light, one axis, down and right
    GROUND_CX/CY   0.44 / 0.28           the ground radial's own centre
    SHADOW_DX/DY   6 / 16                the family's shadow vector
    GROUND_*       the porcelain triad every sibling tile uses
    OP_*, REVEAL   the opening: 568x676 at R 46, cut 22 deep
    REV_*          the reveal's four faces: dark soffit, lit sill, shaded left
                   jamb, bright right jamb
    ROOM_*         the interior, and FLOOR_Y at 762 of 676+166
    REC_*          the record plate, leaning REC_LEAN -2.8 degrees
    EMBER_*        the accent, EMIT at (802,452) with EMIT_R 268. EMBER_CORE is
                   absent from the wash on purpose: in the icon it belongs to the
                   hottest sliver, which sits past the opening's right edge
    CONTACT / AO   warm-neutral, because nothing in this scene emits cool light

  The one thing this banner must not do is put the accent on a rule or an
  underline. The icon's whole claim is that the accent is spent ONLY as interior
  light: what is held is lit, and what is not held is absent rather than
  invented. So the right-hand device is a second portal cast into the banner's
  own porcelain wall, with the same opening ratio, the same four reveal faces and
  the same emitter position, holding one raked record. There is no other warm mark
  anywhere on the page.

  Wordmark is Archivo, already in this family on create-swe-project, discipline
  and shipyard. Its squarer terminals and near-vertical stress read as cut
  lettering rather than as UI type, which is the register a disclosure artifact
  wants, and its narrow advance is what keeps a 24-character name legible on the
  catalogue card.

  Artwork is the real icon.png, downscaled to 2x its display size and inlined as a
  data URI: a file:// page here does not fetch file:// subresources, so
  src="icon.png" renders a hole and reports no error.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    /* GROUND_HI / GROUND_MID / GROUND_LO on the KEY axis (150,40)->(900,990),
       which is 142deg in CSS terms, with the ground radial at GROUND_CX/CY. */
    background:
      radial-gradient(124% 152% at 44% 28%, rgba(255,255,255,.94) 0%, rgba(255,255,255,0) 58%),
      linear-gradient(142deg, #FDFCFA 0%, #EFECE5 52%, #D8D3C9 100%);
    font-family: "Archivo", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 92px; overflow: hidden; position: relative;
  }

  /* CONTACT #6B5C46 at SHADOW_DX/DY 6,16 scaled by 272/1024 */
  .icon { width: 272px; height: 272px; flex: none;
          filter: drop-shadow(2px 4px 30px rgba(107,92,70,.28)); }

  h1 { font-size: 76px; font-weight: 700; letter-spacing: -.032em; line-height: .98;
       color: #262B31; }                       /* ROOM_HI, the graphite ink */
  p { margin-top: 24px; font-size: 25px; line-height: 1.44; max-width: 724px;
      font-weight: 400; color: #6B5C46; }      /* CONTACT, the warm-neutral */
  p b { color: #262B31; font-weight: 600; }

  /* ---- the second portal, cast into the banner's own wall ------------------
     Opening 568x676 at R 46 in the icon; 277x330 at R 22 here, the same ratio.
     REVEAL 22 becomes 11, drawn as a four-colour border so each cut face keeps
     the value the icon measured for it. */
  /* Hung off the right edge on purpose. Cast fully inside the frame, a four-sided
     pale reveal around a dark interior reads as a screen in a bezel; running the
     right jamb past the edge makes it an opening in a WALL again, and it puts the
     emitter off-frame, which is where EMIT_CX 802 sits relative to the opening's
     own right edge at 796 anyway. */
  .vault { position: absolute; right: -22px; top: 70px; width: 319px; height: 380px; }

  .reveal {
    position: absolute; inset: 0; border-radius: 26px;
    border-style: solid; border-width: 12px;
    border-top-color: #6F6A62;                 /* REV_SOFFIT: a lit recess has a dark soffit */
    border-bottom-color: #E3DED4;              /* REV_SILL_HI: and a lit sill */
    border-left-color: #8F8A82;                /* REV_JAMB_L: turned away from the key */
    border-right-color: #C6C1B8;               /* REV_JAMB_R: lit by the key AND the room */
    box-shadow:
      0 0 0 1.5px #FFFDF8,                       /* REV_LIP, the eased outer lip */
      0 26px 44px rgba(90,76,57,.20),          /* AO */
      inset 0 2px 6px rgba(8,10,12,.55);
  }

  /* the room. ROOM_LO under the soffit, brightening to ROOM_HI at the sill where
     the bounce reaches. Every percentage below is measured against the ROOM
     (RM_W 524 x RM_H 632), not the opening, because that is the box .room
     actually is: the reveal's border eats REVEAL off each side. */
  .room {
    position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
    background:
      /* EMIT is (802,452) with EMIT_R 268, which against the room is 105% across,
         42% down, and a radius of 51% x 42%. That is the hot core. The wider,
         weaker wash over it is the room's own bounce, which the icon paints as
         separate layers rather than as a bigger emitter. */
      radial-gradient(51% 42% at 105% 42%,
        #FA9247 0%, #E8542A 44%, rgba(179,59,20,.40) 78%, rgba(179,59,20,0) 100%),
      radial-gradient(114% 96% at 104% 46%,
        rgba(232,84,42,.80) 0%, rgba(179,59,20,.38) 46%, rgba(60,22,10,0) 100%),
      radial-gradient(58% 52% at 0% 2%, rgba(8,10,12,.72) 0%, rgba(8,10,12,0) 100%),
      linear-gradient(160deg, #080A0C 0%, #101419 56%, #262B31 100%);
  }
  /* FLOOR_Y 762 sits 91% down the room */
  .floor { position: absolute; left: 0; right: 0; top: 91%; bottom: 0;
           background: linear-gradient(180deg, #141920, #0C0F13); }

  /* The record plate is drawn as an SVG polygon with REC_LEAN baked into its
     coordinates rather than as a rotated box: this engine aliases a rotated box
     into a visible staircase at 2x, and it antialiases a path cleanly. */
  .record { position: absolute; inset: 0; }

  /* the scatter on the porcelain just outside the opening. The one place the
     accent leaves the room, and it leaves as light rather than as a mark. */
  .spill { position: absolute; left: -170px; top: -4%; width: 260px; height: 108%;
           background: radial-gradient(62% 50% at 96% 46%,
             rgba(250,146,71,.16) 0%, rgba(232,84,42,.06) 44%, rgba(232,84,42,0) 100%); }
</style>
