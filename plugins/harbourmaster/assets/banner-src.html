<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }

  /* Porcelain register, matching the icon and the rest of the daylight family.
     The dark ground belongs to trawl. */
  body { width: 1600px; height: 520px; overflow: hidden; position: relative;
         background:
           radial-gradient(130% 190% at 22% 34%, #fdfcfa 0%, #f4f0e9 44%, #e8e2d7 78%, #ddd6c9 100%);
         font-family: "Schibsted Grotesk", -apple-system, sans-serif; }

  /* The motif is the icon's berth run continued off-canvas: marks receding to
     the right, the near ones lit and the far ones not. It says the same thing
     the icon does — the light reaches only so far — rather than decorating. */
  svg.berths { position: absolute; inset: 0; }

  .lockup { position: absolute; left: 148px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 76px; }
  .icon-seat { position: relative; display: inline-block; flex: none; line-height: 0; }
  /* drop-shadow() is accepted and never painted by this engine, so the shadow
     is carried by a seated rounded rect behind the full-bleed superellipse. */
  .icon-shadow { position: absolute; left: 0; top: 0; width: 292px; height: 292px;
                 border-radius: 22.37%; box-shadow: 0 20px 55px rgba(64,58,48,0.127); }
  .icon { position: relative; width: 292px; height: 292px; }
  .words { padding-bottom: 10px; }
  .wordmark { font-size: 132px; font-weight: 700; letter-spacing: -0.038em;
              line-height: 1; color: #2f343e; }
  .tagline { margin-top: 28px; font-size: 32px; font-weight: 400;
             letter-spacing: .002em; color: #6f7683; }
  .tagline b { color: #2f343e; font-weight: 500; }
</style>
</head>

        <stop offset="0" stop-color="#ec6640"/>
        <stop offset="1" stop-color="#f98a45"/>
      </linearGradient>
      <linearGradient id="fade" x1="1330" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3a4551" stop-opacity=".55"/>
        <stop offset="1" stop-color="#3a4551" stop-opacity=".14"/>
      </linearGradient>
      <radialGradient id="pool" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#f0642e" stop-opacity=".16"/>
        <stop offset="1" stop-color="#f0642e" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <ellipse cx="1210" cy="432" rx="360" ry="104" fill="url(#pool)"/>

    <!-- three the light reaches -->
    <g fill="url(#ember)">
      <rect x="1024" y="420" width="86" height="26" rx="13"/>
      <rect x="1136" y="420" width="86" height="26" rx="13"/>
      <rect x="1248" y="420" width="86" height="26" rx="13"/>
    </g>
    <!-- and two beyond it -->
    <g fill="url(#fade)">
      <rect x="1360" y="420" width="86" height="26" rx="13"/>
      <rect x="1472" y="420" width="86" height="26" rx="13"/>
    </g>
  </svg>
