    <line x1="1304" y1="340" x2="1288" y2="490" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="1356" y1="314" x2="1340" y2="442" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="982" y1="292" x2="966" y2="404" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="1396" y1="300" x2="1380" y2="404" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.34"/>

