        <line x1="-32.4" y1="-88.0" x2="-32.4" y2="88.0"/>
        <line x1="32.4" y1="-88.0" x2="32.4" y2="88.0"/>
        <line x1="97.2" y1="-88.0" x2="97.2" y2="88.0"/>
        <line x1="-162.0" y1="-29.3" x2="162.0" y2="-29.3"/>
        <line x1="-162.0" y1="29.3" x2="162.0" y2="29.3"/>
    </g>
    <rect x="-176" y="-102" width="352" height="204" rx="20"
