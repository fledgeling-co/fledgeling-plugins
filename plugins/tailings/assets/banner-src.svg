    <radialGradient id="lift" cx="0.72" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#lift)"/>

  <line x1="1030" y1="300" x2="1014" y2="450" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="1084" y1="326" x2="1068" y2="504" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="1140" y1="306" x2="1124" y2="456" stroke="url(#silt)" stroke-width="8" stroke-linecap="round" opacity="0.62"/>
