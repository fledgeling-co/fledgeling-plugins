    <g>
        <g transform="translate(-92,-12)"><circle r="34" fill="url(#glow)" opacity="0.72"/><circle r="15" fill="#E0A55C"/><circle r="7" cx="-3" cy="-3" fill="#FFD9A0"/></g>
        <g transform="translate(14,24)"><circle r="34" fill="url(#glow)" opacity="0.72"/><circle r="15" fill="#E0A55C"/><circle r="7" cx="-3" cy="-3" fill="#FFD9A0"/></g>
        <g transform="translate(104,-32)"><circle r="34" fill="url(#glow)" opacity="0.72"/><circle r="15" fill="#E0A55C"/><circle r="7" cx="-3" cy="-3" fill="#FFD9A0"/></g>
