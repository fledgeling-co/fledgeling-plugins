<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2B3138"/><stop offset="1" stop-color="#171B20"/>
    </linearGradient>
    <linearGradient id="silt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96A3B0"/><stop offset="1" stop-color="#3A434D" stop-opacity="0"/>
