<!doctype html>
<meta charset="utf-8">
<title>create-website banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* create-website banner. Every value below is derived from assets/build_icon.py rather than
     measured off a sibling banner; banner-brief.md holds the table of which constant drives what.
     Ground ramp = GROUND_HI/MID/LO on the icon's own gradient axis, (330,0) to (620,1024), which
     is 15.8 degrees off vertical, so 164deg. Vignette = VIGNETTE at 0.22, centred 0.42/0.30.
     Every shadow offsets along -LIGHT_DX,-LIGHT_DY = (+0.62,+0.78), the key's bearing.
     Palette is SECTIONS: hero ember, middle stone, base graphite. The ember is a fill only; at
     mono body size the accent is the lifted #A83A14, 5.6:1 on this ground where raw ember is 2.6. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(92% 260% at 42% 30%, rgba(196,184,153,0) 60%, rgba(196,184,153,.22) 100%),
      linear-gradient(164deg, #FDFCF9 0%, #F3EFE7 55%, #E7E1D5 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    overflow: hidden; position: relative;
  }

  /* --- the icon, at the left, carrying the only warm mass on this half of the banner --- */
  .tile { position: absolute; left: 118px; top: 130px; width: 260px; height: 260px;
          border-radius: 58px;
          box-shadow: 16px 20px 40px rgba(150,132,104,.30), 5px 6px 12px rgba(94,79,58,.20); }
  .icon { position: absolute; left: 104px; top: 116px; width: 288px; height: 288px; }

  /* --- the wordmark and the one essence line --- */
  .text { position: absolute; left: 456px; top: 167px; width: 640px; }
  h1 { font-size: 86px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #241F1B; }
  p  { margin-top: 26px; font-size: 26px; line-height: 1.42; font-weight: 400; color: #5E4F36;
       max-width: 620px; text-wrap: pretty; }
  p b { color: #241F1B; font-weight: 500; }

  /* --- four motion paths, four different left ends, one shared arrival ---
     Row pitch 56 against a 43px track inset holds PITCH_HERO:PITCH_BASE = 215:165 = 1.303. */
  .paths { position: absolute; left: 1132px; top: 130px; width: 364px; }
  .row { position: relative; height: 56px; }
  .lab { position: absolute; left: 0; top: 19px; width: 150px;
         font: 500 16px/1 "IBM Plex Mono", ui-monospace, monospace;
         color: #5E4F36; letter-spacing: .02em; }
  .track { position: absolute; left: 164px; top: 0; width: 200px; height: 56px; }
  .rail { position: absolute; left: 0; top: 27px; width: 200px; height: 2px;
          background: #D7CBB4; border-radius: 1px; }
  /* the arrival: identical in all four rows, and all four land on the same right edge */
  .plate { position: absolute; right: 0; top: 18px; width: 46px; height: 20px; border-radius: 7px;
           background: linear-gradient(164deg, #F7995F 0%, #EC6A31 46%, #D14E1C 100%);
           box-shadow: 2px 3px 6px rgba(110,36,9,.30); }
  /* ghosts of the same plate, in stone, standing for where it came from. They are narrower than
     the arrival and spaced to leave air: at 46px wide and 36px apart the three overlapped into
     one blurred bar with two lumps, which reads as a smudge rather than as three steps. */
  .ghost { position: absolute; top: 18px; width: 26px; height: 20px; border-radius: 6px;
           background: #BCAA8C; }
  .g1 { left: 0;    opacity: .20; }
  .g2 { left: 42px; opacity: .36; }
  .g3 { left: 84px; opacity: .56; }
  /* reduced motion: the section cross-fades in place instead of travelling */
  .fade { position: absolute; left: 0; top: 18px; width: 128px; height: 20px; border-radius: 7px;
          background: linear-gradient(90deg, rgba(188,170,140,0) 0%, rgba(188,170,140,.60) 100%); }
  /* no webgl: the 3D scene resolves to one still plate */
  .still { position: absolute; left: 0; top: 18px; width: 46px; height: 20px; border-radius: 7px;
           background: #BCAA8C; opacity: .58; }
  /* touch: the same section, started by a finger */
  .tap { position: absolute; left: 8px; top: 15px; width: 26px; height: 26px; border-radius: 50%;
         border: 2px solid #BCAA8C; }
  .tap i { position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; border-radius: 50%;
           background: #BCAA8C; }
  .cap { margin-top: 20px; font: 500 16px/1 "IBM Plex Mono", ui-monospace, monospace;
         color: #5E4F36; letter-spacing: .02em; }
  .cap em { font-style: normal; color: #A83A14; }
</style>
