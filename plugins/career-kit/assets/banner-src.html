<!doctype html>
<meta charset="utf-8">
<title>career-kit banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The fledgeling banner system (duo-craft's and home-craft's banner-src.html): Instrument Sans
     wordmark, IBM Plex Mono for measured labels, the porcelain ground ramp and the ember accent
     from build_icon.py. The bars on the right are the icon's rungs laid out as the lines of a
     page: the 8 sections resume-craft gives a job to, with the summary in ember. Rail and rung
     colours are build_icon.py's RAIL_FACE (#4F453D), RUNG_FACE (#B0A28F) and ACCENT (#E9562A). */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(128% 330% at 34% 2%, rgba(255,255,255,.90) 0%, rgba(255,255,255,0) 54%),
      radial-gradient(118% 172% at 42% 36%, rgba(196,184,153,0) 58%, rgba(196,184,153,.30) 100%),
      linear-gradient(141deg, #FDFCF9 0%, #F3EFE7 52%, #E7E1D5 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px; border-radius: 58px;
          box-shadow: 18px 24px 40px rgba(150,132,104,.30), 6px 9px 12px rgba(94,79,58,.20); }
  .icon { width: 280px; height: 280px; flex: none; position: relative; }
  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #2A2320; }
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400; color: #5E4F3A; max-width: 580px; }
  p b { color: #2A2320; font-weight: 500; }
  .lab { position: absolute; font: 500 17px/1 "IBM Plex Mono", ui-monospace, monospace; color: #5E4F3A; letter-spacing: .04em; }
  .lab em { font-style: normal; color: #B8431E; }
  /* the page: two rails and eight rungs, one per section of a resume */
  .page { position: absolute; left: 1128px; top: 96px; width: 330px; height: 250px; }
  .rail { position: absolute; top: 0; width: 16px; height: 250px; border-radius: 8px; background: #4F453D;
          box-shadow: 6px 8px 14px rgba(150,132,104,.26); }
  .rail.a { left: 0; } .rail.b { right: 0; }
  .r { position: absolute; left: 26px; height: 16px; border-radius: 8px; background: #B0A28F;
       box-shadow: 4px 6px 10px rgba(150,132,104,.24); }
  .r.on { background: #E9562A; box-shadow: 0 0 16px rgba(233,86,42,.38), 4px 6px 10px rgba(150,132,104,.24); }
</style>
