<!doctype html>
<meta charset="utf-8">
<title>should-compact banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<!--
  Derived from assets/build_icon.py. Every geometric ratio below is that file's
  own constants at k = 0.64, and every colour is one of its named values:

    SEAM_W 74 : BLOCK_W_L 330 : BLOCK_W_R 246   the asymmetric pair and the gap
    BLOCK_H 392 / BLOCK_H_R 330                 unequal masses, so the seam is not
                                                a symmetry axis
    RIGHT_LIFT 78                               the held beat: a pause, not a stop
    R_SHOULDER 46                               gel is poured, not cut
    GROUND_TOP/MID/BOT                          neutral, NOT the family's warm
                                                porcelain: this icon's ground is
                                                sampled cool and stays cool
    GRAPHITE[]                                  a top-lit ramp, light from directly
                                                overhead, so nothing here is
                                                obliquely cast
    SEAM_CORE/MID/EDGE                          the one accent
    bloom / contact ellipses                    rx 330 ry 120 and rx 352 ry 62

  The signature move is that the focal element is EMPTY. The icon's own notes
  record what breaks it: drawn on top with rounded caps, the seam became a glowing
  capsule sitting between two blocks, which is an object, and the whole argument is
  that the subject is the space. So here too the seam is drawn BEHIND the masses and
  overrun at both ends by RIGHT_LIFT's own 34px, letting the blocks set its extent.
  It has no outline of its own anywhere in this file.

  Wordmark is Schibsted Grotesk, matching resume-session, which is the skill on the
  other side of this same boundary: this one says when the session may be cut, that
  one picks it back up. Its high x-height and short descenders keep a
  fourteen-character hyphenated name legible on a catalogue card, and it is already
  in the family rather than a thirteenth face.

  Artwork is the real icon.png (the 1024 render, also on disk as icon-1024.png),
  downscaled to 2x its display size and inlined as a data URI, because a file://
  page here does not fetch file:// subresources and fails silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    /* GROUND_TOP -> GROUND_MID at .55 -> GROUND_BOT, vertical because the key is
       directly above, plus the icon's own vignette: cx .5 cy .46 r .72, black at
       .07 from offset .62. */
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(0,0,0,0) 62%, rgba(0,0,0,.07) 100%),
      linear-gradient(180deg, #FFFFFF 0%, #F7F6F4 55%, #E5E4E1 100%);
    font-family: "Schibsted Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 92px; overflow: hidden; position: relative;
  }

  /* the contact radial is #1E242A: cool, and cast straight down, because this
     icon's key is overhead rather than oblique */
  .icon { width: 272px; height: 272px; flex: none;
          filter: drop-shadow(0 14px 32px rgba(30,36,42,.24)); }

  h1 { font-size: 88px; font-weight: 700; letter-spacing: -.038em; line-height: 1;
       color: #1E242A; white-space: nowrap; }        /* GRAPHITE[2] */
  /* the one warm mark in the type, and it sits exactly where the icon puts its
     light: between the two masses. SEAM_MID. */
  h1 i { font-style: normal; color: #FF7A2E; }

  p { margin-top: 26px; font-size: 26px; line-height: 1.42; max-width: 606px;
      font-weight: 400; color: #4A535B; }            /* GRAPHITE[0] */
  p b { color: #1E242A; font-weight: 500; }

  /* ---- the seam, at bench scale -----------------------------------------
     k = 0.64 throughout. Container is 455x370, hung at the right; the bloom is
     allowed past its box because it is light rather than an edge. */
  .seambench { position: absolute; right: 56px; top: 75px; width: 455px; height: 370px; }

  /* the seam's light reaching the porcelain, and the contact shadow it sits in */
  .bloom, .contact { position: absolute; border-radius: 50%; }
  .bloom {
    left: 43.5px; top: 246px; width: 422px; height: 154px;   /* rx 211, ry 77 */
    background: radial-gradient(closest-side, rgba(255,122,46,.50), rgba(255,122,46,.16) 45%, rgba(255,122,46,0));
  }
  .contact {
    left: 29.5px; top: 302px; width: 450px; height: 80px;    /* rx 225, ry 40 */
    background: radial-gradient(closest-side, rgba(30,36,42,.34), rgba(30,36,42,.10) 62%, rgba(30,36,42,0));
  }

  /* the seam: three stacked columns, all of them BEHIND the masses and all of
     them overrunning top and bottom, so the blocks clip them. No caps, no
     outline, no capsule. */
  /* The icon overruns the seam by 34px past both masses, which at 1024 reads as
     light escaping a gap. At bench scale the same ratio reads as a lit tube
     passing behind two blocks, so the overrun is cut to a third of it and the
     ends dissolve over a longer run: the extent is still set by the masses, and
     the light still has no cap. */
  .soft, .col, .ends { position: absolute; top: 14px; height: 325px; }
  .soft { left: 212.5px; width: 85px;                        /* SEAM_W * 1.8 */
          background: linear-gradient(90deg, rgba(255,122,46,0), rgba(255,122,46,.55) 50%, rgba(255,122,46,0)); }
  /* The icon lays a hard SEAM_CORE column over a vertical EDGE->CORE->EDGE ramp.
     At 74px of 1024 those two read as one gap of light; at 47px on a 1600 bench
     the hard column separates out and the seam starts reading as a striped
     OBJECT, which is the failure the icon's own notes warn about. So the same
     intensity field is drawn as one soft profile instead: SEAM_CORE at the
     centre of the gap, SEAM_EDGE where the masses meet it. Simplified, not
     enlarged. */
  .col  { left: 231px; width: 47px;                          /* SEAM_W */
          background: linear-gradient(90deg, #B8380C 0%, #FF7A2E 29%, #FFF1E2 50%,
                      #FF7A2E 71%, #B8380C 100%); }
  /* the vertical falloff: SEAM_EDGE reclaiming both overrun ends, so the light
     dims where nothing bounds it rather than stopping at a cap */
  .ends { left: 231px; width: 47px;
          background: linear-gradient(180deg, rgba(184,56,12,.98) 0%, rgba(184,56,12,0) 13%,
                      rgba(184,56,12,0) 87%, rgba(184,56,12,.98) 100%); }

  /* the two masses. They bound the light; they are not the subject. */
  .mass { position: absolute; border-radius: 29px;           /* R_SHOULDER */
          background: linear-gradient(180deg, #4A535B 0%, #2E363D 34%, #1E242A 76%, #141A1F 100%);
          box-shadow: inset 0 0 0 1.3px rgba(255,255,255,.16); }
  /* one soft top light, no hard speculars, exactly as the icon's topEdge does */
  .mass::after { content: ""; position: absolute; inset: 0; border-radius: 29px;
                 background: linear-gradient(180deg, rgba(255,255,255,.30) 0%,
                             rgba(255,255,255,.05) 13%, rgba(255,255,255,0) 100%); }
  .left  { left: 20px;  top: 76px; width: 211px; height: 251px; }
  .right { left: 278px; top: 26px; width: 157px; height: 211px; }
  /* The warm bounce the icon's own block() docstring calls for and its shipped
     paths never draw: the seam is emissive, so the faces looking into it have to
     pick its light up, or the pair reads as two objects that happen to sit near a
     glowing line rather than two objects lit BY the gap. SEAM_MID, low alpha. */
  .mass b { position: absolute; top: 0; bottom: 0; width: 21%; }
  .left b  { right: 0; border-radius: 0 29px 29px 0;
             background: linear-gradient(90deg, rgba(255,122,46,0), rgba(255,122,46,.17)); }
  .right b { left: 0;  border-radius: 29px 0 0 29px;
             background: linear-gradient(270deg, rgba(255,122,46,0), rgba(255,122,46,.17)); }
</style>
