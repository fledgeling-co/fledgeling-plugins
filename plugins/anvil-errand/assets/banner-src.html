<meta charset="utf-8">
<title>anvil-errand banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap">
<!--
  Every colour and every offset below is read out of assets/build_icon.py, named
  in a comment at the point of use. Nothing here was matched by eye against a
  sibling banner, because this icon is lit differently from all of them: its key
  is up-LEFT-front, where most of the family lights from up-centre.

    LIGHT_DIR   (0.52, 0.80, 0.30)  direction of TRAVEL, so the source is up-left
    VIEW_X/Y    -0.34 / -0.55       the oblique projection, far cap up and left
    DEPTH       152                 the anvil's width into the scene
    PORC_*      the cushion ramp, brightest at the top
    GRAPHITE[]  the Lambert-indexed ramp for every graphite face
    HOT_*       the one warm family, spent only on the work and its trajectory
    SHADOW      #4E4437 warm-neutral, cast dx 26 dy 12 (right and slightly down)

  The right-hand device is the icon's signature move restated at bench scale: one
  incandescent ribbon, thin where it departs off the upper right and thick where
  it ARRIVES on a hot billet resting on an obliquely extruded graphite ledge.
  Out and back is the whole of "errand", and it costs one stroke.

  Artwork is the real icon.png, downscaled to 2x its display size and inlined as a
  data URI: a file:// page here does not fetch file:// subresources, so a plain
  src="icon.png" renders as a hole with no error at all.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    /* PORC_HI / PORC_MID / PORC_LO, brightest at the TOP as the corpus measured,
       plus VIGNETTE #B4A992 as the warm edge fall-off. The specular sits at 34%
       across because LIGHT_DIR's x:y is 0.52:0.80, which puts the source up and
       to the left rather than overhead. */
    background:
      radial-gradient(118% 148% at 34% -14%, rgba(255,255,255,.92) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(122% 168% at 50% 52%, rgba(180,169,146,0) 50%, rgba(180,169,146,.20) 100%),
      linear-gradient(176deg, #FFFEFB 0%, #F8F4EC 54%, #E9E2D5 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 58px;
    padding: 0 92px; overflow: hidden; position: relative;
  }

  /* SHADOW #4E4437 at the icon's own cast vector, scaled by 272/1024 */
  .icon { width: 272px; height: 272px; flex: none;
          /* inert in this engine, removed: drop-shadow(7px 3px 30px rgba(78,68,55,.30)) */ }

  .copy { position: relative; z-index: 2; }
  h1 { font-size: 96px; font-weight: 700; letter-spacing: -.036em; line-height: 1;
       color: #1A1E24;                       /* GRAPHITE[1] */
       white-space: nowrap; }
  /* The hyphen is the trip: the only warm mark in the type, and the icon spends
     its amber only on the work and the path it travels. HOT_EDGE. */
  h1 i { font-style: normal; color: #F0601A; }

  p { margin-top: 26px; font-size: 26px; line-height: 1.42; max-width: 604px;
      font-weight: 400; color: #4E4437; }    /* SHADOW, the warm-neutral */
  p b { color: #242931; font-weight: 500; }  /* GRAPHITE[2] */

  /* the bench: 560x420, hung off the right so the ribbon's thin end leaves the
     frame. Decorative bleed only; no text goes past 1600. */
  .bench { position: absolute; right: -18px; top: 68px; width: 560px; height: 420px; }
</style>

<div class="copy">
  <h1>anvil<i>-</i>errand</h1>
  <p>Send an agent to do the work on another machine. <b>It names the missing
     piece before anything starts</b>, not halfway through a container start.</p>
</div>

<svg class="bench" viewBox="0 0 560 420" fill="none">
  <defs>
    <!-- the three ledge faces, in the order the icon's Lambert term puts them:
         top plane brightest, then the left end, then the near flank -->
    <linearGradient id="topFace" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#3B424E"/><stop offset="1" stop-color="#2F353F"/>
    </linearGradient>
    <linearGradient id="flank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1E24"/><stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <!-- SATIN #8D96A5: the broad soft sheen a struck face carries -->
    <linearGradient id="satin" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#8D96A5" stop-opacity=".00"/>
      <stop offset=".46" stop-color="#8D96A5" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8D96A5" stop-opacity=".00"/>
    </linearGradient>
    <!-- the billet: HOT_CORE on top, HOT_MID / HOT_EDGE down its faces -->
    <linearGradient id="billetTop" x1="0" y1="1" x2=".3" y2="0">
      <stop offset="0" stop-color="#FFC55E"/><stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <linearGradient id="billetFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA23C"/><stop offset="1" stop-color="#F0601A"/>
    </linearGradient>
    <!-- SPILL #FFB055: an emitter on a light ground brightens what it touches -->
    <radialGradient id="spill" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFB055" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#FFB055" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFB055" stop-opacity="0"/>
    </radialGradient>
    <!-- SHADOW #4E4437, cast right and slightly down, away from the key -->
    <radialGradient id="contact" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4E4437" stop-opacity=".34"/>
      <stop offset=".62" stop-color="#4E4437" stop-opacity=".11"/>
      <stop offset="1" stop-color="#4E4437" stop-opacity="0"/>
    </radialGradient>
    <!-- the ribbon: HOT_CORE reserved for the landing end, HOT_LO for the body,
         fading to nothing at the departure rather than stopping -->
    <linearGradient id="ribbon" x1="188" y1="214" x2="600" y2="130"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3D6"/>
      <stop offset=".10" stop-color="#FFA23C"/>
      <stop offset=".34" stop-color="#F0601A"/>
      <stop offset=".70" stop-color="#D2430A"/>
      <stop offset=".93" stop-color="#A82F06" stop-opacity=".85"/>
      <stop offset="1" stop-color="#A82F06" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- contact shadow, offset by SHADOW_DX/DY 26,12 scaled to the ledge -->
  <ellipse cx="176" cy="317" rx="150" ry="26" fill="url(#contact)"/>
  <!-- the spill the billet throws onto the porcelain -->
  <ellipse cx="182" cy="252" rx="196" ry="86" fill="url(#spill)"/>

  <!-- the ledge, one oblique solid. Far cap offset by DEPTH*(VIEW_X, VIEW_Y),
       i.e. (-28.4, -46.1) at this scale: up and to the LEFT, so the top plane,
       the left end and the near flank are the visible faces. -->
  <path d="M66,250 L37.6,203.9 L229.6,203.9 L258,250 Z" fill="url(#topFace)"/>
  <path d="M66,250 L37.6,203.9 L37.6,262.9 L66,309 Z" fill="#242931"/>
  <path d="M66,250 L258,250 L258,309 L66,309 Z" fill="url(#flank)"/>
  <path d="M66,250 L258,250 L258,309 L66,309 Z" fill="url(#satin)"/>
  <!-- RIM_CATCH #C3C8D3: the lit edge, measured at L 0.784 -->
  <path d="M37.6,203.9 L229.6,203.9" stroke="#C3C8D3" stroke-opacity=".55" stroke-width="2"/>
  <path d="M66,250 L258,250" stroke="#C3C8D3" stroke-opacity=".30" stroke-width="2"/>

  <!-- HARDIE_U/V/S and PRITCHEL_U/V/R, cut into the face plane rather than drawn
       on it, and projected with the same view constants. CAVITY #0B0D10. -->
  <path d="M87.4,231.2 L111.6,231.2 L103.4,217.9 L79.2,217.9 Z" fill="#0B0D10" fill-opacity=".85"/>
  <ellipse cx="124.8" cy="227.6" rx="9.4" ry="5.2" fill="#0B0D10" fill-opacity=".85"/>

  <!-- the return arc. Widths ARC_W_FAR 0.6 -> ARC_W_NEAR 21, sampled at
