<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  create-mac-icon README banner, 1600x520, rendered at 2x to 3200x1040.

  Subject-mined from the shipping icon rather than decorated to match it. The icon is the
  layered vector master, whose whole construction is one superellipse on a dimetric ground
  plane: the outer mask, the mould cavity, the cast. The banner is the rest of that same
  bench. The two empty cavities on the right are the SAME path under the SAME projection
  (KX 1.0, KY 0.515, the icon's own frame), scaled up and cut by the frame, so the bench
  the icon sits on visibly continues past the edge and there is another one waiting. The
  nearer cavity holds the same warm bounce the icon's does, at a fraction of the strength.
  Any change to the icon's KY or to its palette must be re-derived here, or the plane tilts
  out of register with itself.

  Ground is the porcelain register the marketplace uses by default; the dark register
  belongs to the sibling trawl. The one warm accent is spent where the icon spends it,
  on the cast and on the warmth a cast leaves behind, and nowhere else.

  Type is Sora, whose bowls are drawn as squared circles rather than true ones, which is
  the superellipse the icon is built from, in type. No sibling in this marketplace uses it.
-->
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 520px; overflow: hidden; position: relative;
    background: #F3EFE7;
    font-family: "Sora", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg.bench { position: absolute; inset: 0; }

  .lockup { position: absolute; left: 112px; top: 0; height: 520px;
            display: flex; align-items: center; gap: 76px; }
  .icon { width: 292px; height: 292px; flex: none;
          filter: drop-shadow(0 20px 42px rgba(74, 60, 42, .26)); }

  .wordmark { font-size: 82px; font-weight: 600; letter-spacing: -0.038em;
              line-height: 1; color: #2B2620; white-space: nowrap; }
  .tagline { margin-top: 26px; font-size: 25px; font-weight: 400;
             letter-spacing: -0.004em; color: #6E6355; white-space: nowrap; }
  .tagline b { color: #332D25; font-weight: 500; }
</style>
</head>
<body>
  <svg class="bench" width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- one soft top-left light across the bench, the icon's own light model extended -->
      <radialGradient id="light" cx="300" cy="80" r="1500" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFFDF8"/>
        <stop offset="0.46" stop-color="#F5F1E9"/>
        <stop offset="1" stop-color="#E7E0D2"/>
      </radialGradient>
      <!-- a cavity is a void: dark at its far wall, paling toward the near lip -->
      <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9E927B" stop-opacity=".52"/>
        <stop offset="0.38" stop-color="#B6AB93" stop-opacity=".30"/>
        <stop offset="0.78" stop-color="#D6CDB9" stop-opacity=".12"/>
        <stop offset="1" stop-color="#EFE8DA" stop-opacity="0"/>
      </linearGradient>
      <!-- the warmth a cast leaves behind, at a fraction of the icon's strength -->
      <radialGradient id="bounce" cx="0.48" cy="0.36" r="0.62">
        <stop offset="0" stop-color="#FF9C60" stop-opacity=".34"/>
        <stop offset="0.46" stop-color="#FF9C60" stop-opacity=".16"/>
        <stop offset="1" stop-color="#FF9C60" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="lip" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
        <stop offset="0.62" stop-color="#FFFFFF" stop-opacity=".40"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity=".10"/>
      </linearGradient>
    </defs>

    <rect width="1600" height="520" fill="url(#light)"/>
    <g id="cavities"></g>
  </svg>

  <script>
    // The marketplace superellipse, verbatim, under the icon's own dimetric projection.
