<!doctype html>
<meta charset="utf-8">
<title>ux-craft banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Every value below is lifted from assets/build_icon.py and named in the comment
     that carries it. Nothing here was sampled off a sibling banner.

     Engine facts this composition works around, measured 2026-08-19:
       filter: drop-shadow() paints nothing here, so the tile's contact shadow is a
         box-shadow on a transparent backing box, which suits a squircle tile;
       CSS border-radius always draws a superellipse, so a box asked for an ellipse
         returns a squircle and clip-path: ellipse() is accepted and inert. Inline
         SVG, on the other hand, renders paths, clipPath, masks, feGaussianBlur and
         userSpaceOnUse gradients correctly, so the crossing below is SVG. */

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }

  body {
    /* GROUND_HI / GROUND_MID / GROUND_EDGE, ramped along the light axis.
       LIGHT_ANGLE_DEG 118 gives LX +0.469 and LY +0.883: the key travels right and
       down, so the ground falls toward the shade at atan2(0.469, -0.883) = 152deg.
       The highlight sits at the ground gradient's own cx 0.40 / cy 0.30, and the
       vignette is VIGNETTE at its own VIGNETTE_A 0.22. */
    background:
      radial-gradient(120% 320% at 40% 30%, rgba(255,255,255,.86) 0%, rgba(255,255,255,0) 56%),
      radial-gradient(120% 175% at 50% 50%, rgba(139,127,102,0) 54%, rgba(139,127,102,.22) 100%),
      linear-gradient(152deg, #FDFBF6 0%, #F4EFE3 56%, #E1D9C8 100%);
    font-family: "Instrument Sans", system-ui, sans-serif;
    display: flex; align-items: center; gap: 66px;
    padding-left: 104px; overflow: hidden; position: relative;
  }

  /* ---------------------------------------------------------------- lockup */
  /* The light axis (LX, LY) x 40, in SHADOW #3A3126. Inset 6px inside the tile so
     nothing shows on the up-light side. */
  .tile { position: absolute; left: 110px; top: 126px; width: 268px; height: 268px;
          border-radius: 58px 58px 58px 58px;
          box-shadow: 19px 35px 38px rgba(58,49,38,.26); }
  .icon { width: 280px; height: 280px; flex: none; }

  h1 { font-size: 90px; font-weight: 600; letter-spacing: -.03em; line-height: 1;
       color: #1E1B16; }                                  /* GEL_LO */
  p  { margin-top: 24px; font-size: 26px; line-height: 1.42; font-weight: 400;
       color: #4A443A; max-width: 560px; }                /* GEL_MID */
  p b { color: #1E1B16; font-weight: 500; }

  /* ---------------------------------------------------------- the crossing
     Emitted by build_icon.py's own ell(), crescent(), vesica(), lens_centre(),
     puck() and key(), against its constants scaled by one factor of 0.52. R_SMALL
     stays the DERIVED R_BIG x ENVELOPE_AA / ENVELOPE_AAA, so the two reach
     envelopes hold their true 44:24 ratio through the scaling instead of being
     re-entered by hand: measured back out of the emitted SVG, 81.7 / 149.8 =
     0.5455 = 24/44. SQUASH 0.66, THICK 32, OFFSET_X 246 and OFFSET_Y 222 are the
     icon's, as are the one shared light ramp, the occlusion crescent, the rim
     light, the porcelain bounce, GEL_ALPHA, KEY_FRAC / KEY_R_FRAC / KEY_THICK, and
     the accent's four stops.

     The crossing is computed, not drawn: vesica() intersects the two envelopes in
     the flat plan and foreshortens the result, so the accent is a property of the
     two objects' relationship rather than a mark painted on either of them. Move
     one control forty units and the tile goes dark, which is the gate's exit code
     drawn as light. */
  .cross { position: absolute; left: 1090px; top: 82px; }

  /* ENVELOPE_AAA 44 and ENVELOPE_AA 24, the two figures that disagreed across
     three of this skill's own files. IBM Plex Mono is the family's measurement
     face, and this is the only place either number appears as type. */
  .fig { position: absolute; font: 500 20px/1 "IBM Plex Mono", ui-monospace, monospace;
         color: #3A3126; letter-spacing: .04em; }
</style>
