<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  agent-voice README banner, 1600x520, rendered at 2x to 3200x1040 by
  create-skill/scripts/render_banner.py, which asserts those dimensions, the
  viewport, and that the web font actually arrived rather than trusting any of
  the three.

  Every number here is READ OUT OF the icon's own build script,
  ./build_icon.py, rather than matched by eye. That script is the authority
  because the icon is a hand-authored layered master with named constants:

    CUR_W, CUR_H        546, 736    the block cursor in the icon's 1024 space
    CUR_X, CUR_Y        239, 152    its top-left, derived not literal
    CUT_W_TOP, _BOT     108, 50     one quote stroke's taper
    CUT_H               486         and its length
    CUT_GAP             66          between the two, measured at the top
    CUT_LEAN            7           degrees, both the same way
    CUT_Y               CUR_Y - 40  the cuts start ABOVE the block's top edge
    CUT1_X, CUT2_X      371, 545    the pair's positions
    GEL                 #F4794A -> #E8542A -> #B93A16
    FACE                #39404A -> #171B21   slate, key light upper-left
    GROUND              #FFFEFB -> #F5F0E5 -> #E2D8C2

  The signature move follows this set's pattern -- the icon's own device leaves
  its tile and rules the bench (tui-craft's character grid does the same). Here
  the thing that leaves is the PAIR OF CUTS: they continue out of the icon at the
  icon's own taper, lean and gap, scaled by the tile's own render scale, and land
  as the two strokes that open the wordmark. So the banner's warm elements are
  not "quote marks that look like the icon's"; they are the icon's cuts,
  continued. Change the icon's taper or lean and this re-derives.

  The icon renders at 300px of a 1024 master, so the scale is 0.29297. A cut
  108px wide in the icon is 31.64px out here, and the 66px gap is 19.34px.

  Beneath the wordmark, the text rules TAPER: five rules whose lengths fall away
  to nothing, and then stop. That is the whole thesis of the skill stated in the
  one place a banner can state anything -- lead with the outcome, then stop. The
  last rule is a stub rather than a full line because an answer that has finished
  does not fill the measure out of politeness.

  The rules sit at 0.16 opacity, not the icon's 0.22 grid value: inside the icon
  the accent works against near-black slate, out here the rules work against
  porcelain, and holding the number would have held the opacity while throwing
  away the contrast relationship that was actually being matched.

  Ground is the porcelain register the marketplace uses by default. Type is
  Martian Mono, the same face as tui-craft: a mono is the honest register for a
  plugin whose subject is text an agent emits into a terminal.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1600px; height: 520px; overflow: hidden; }

  body {
    /* GROUND, verbatim from build_icon.py, at the same 0.34/0.26 focus and 0.96
       radius the icon's own ground gradient uses. */
    background:
      radial-gradient(circle 1540px at 34% 26%,
                      #FFFEFB 0%, #F5F0E5 52%, #E2D8C2 100%);
    display: flex;
    align-items: center;
    gap: 72px;
    padding: 0 100px;
    font-family: "Martian Mono", ui-monospace, SFMono-Regular, monospace;
    color: #1c1f24;
    position: relative;
  }

  /* The icon's own vignette, same colour and same three stops. */
  body::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle 1150px at 50% 50%,
                                rgba(156,141,116,0) 0%,
                                rgba(156,141,116,0.05) 72%,
                                rgba(156,141,116,0.17) 100%);
  }

  .tile { width: 300px; height: 300px; flex: 0 0 auto; position: relative; z-index: 2; }
  .tile img { display: block; width: 300px; height: 300px; }

  .stack { position: relative; z-index: 2; }

  /* The wordmark, OPENED by the icon's own two cuts continued out of the tile.
     They sit tight against the first letter at cap height, the way an opening
     quote sits against the word it opens. The first render floated them in the
     gap between tile and wordmark, where they read as a third element rather
     than as punctuation, and a diffuse glow around them read as a blur. */
  .mark { display: flex; align-items: flex-start; gap: 19.34px; }

  .cut {
    /* 108px -> 31.64px at the top and 50px -> 14.65px at the foot, from the
       icon's own CUT_W_TOP and CUT_W_BOT at the tile's 0.29297 render scale.
       Length is cut to cap height rather than the icon's full 486px: out here
       the strokes are punctuation, and punctuation is measured against the
       letters beside it. */
    width: 31.64px;
    height: 74px;
    flex: 0 0 auto;
    background: linear-gradient(155deg, #F4794A 0%, #E8542A 46%, #B93A16 100%);
    clip-path: polygon(0% 0%, 100% 0%, 73.7% 100%, 26.3% 100%);
    transform: rotate(7deg);            /* CUT_LEAN, verbatim */
    transform-origin: 50% 0%;
    margin-top: 12px;
  }

  .cut + .cut { margin-right: 24px; }   /* the pair, then the measure resumes */

  h1 {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: -0.055em;
    line-height: 0.92;
    color: #171B21;                     /* FACE's dark end: the wordmark is the
                                           same material as the block */
  }

  .tag {
    margin-top: 22px;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.54;
    color: #4A525C;
    max-width: 58ch;
  }

  /* The tapering rules: four falling away, then a stub, then nothing. They are
     indented to the tagline's own left edge so they read as the next paragraph
     rather than as an unrelated row of bars. */
  .rules { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
  .rules i { display: block; height: 5px; border-radius: 3px; background: #39404A; }
  .rules i:nth-child(1) { width: 516px; opacity: 0.15; }
  .rules i:nth-child(2) { width: 404px; opacity: 0.13; }
  .rules i:nth-child(3) { width: 262px; opacity: 0.11; }
  .rules i:nth-child(4) { width: 137px; opacity: 0.09; }
  /* The stub is the accent's second and last appearance: the point the answer
     actually stops at. */
  .rules i:nth-child(5) { width: 44px; opacity: 0.85; background: #E8542A; }

</style>
</head>
