<!--
  Derived from assets/build_icon.py. The stack at the right is the icon's own
  geometry at k = 0.42: four slabs of differing width and offset (SLABS), the
  warm graphite ramp (G_LIT / G_SHADE / G_DEEP), the porcelain ground
  (GROUND_TOP / GROUND_BOT / VIGNETTE) and the one ember (EMBER_MID / EMBER /
  EMBER_DEEP) as the cord. The cord's crossing points are MASTER_X.

  Wordmark is Newsreader, the serif the report and dossier-report banners use,
  because this skill's subject is prose. Weight 600 at display size.

  Artwork is the real icon.png downscaled to 2x its display size and inlined as
  a data URI, because a file:// page here does not fetch file:// subresources
  and fails silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(138,122,98,0) 58%, rgba(138,122,98,.24) 100%),
      linear-gradient(163deg, #F8F5EE 0%, #E4DDCB 100%);
    font-family: "Newsreader", Georgia, serif;
    display: flex; align-items: center; gap: 60px;
    padding: 0 96px; overflow: hidden; position: relative;
  }
  .icon { width: 272px; height: 272px; flex: none; }
  .content { max-width: 700px; z-index: 2; }
  h1 { font-size: 88px; font-weight: 600; letter-spacing: -.02em; line-height: 1; color: #221E18; }
  h1 i { font-style: normal; color: #DE5A28; }
  p { margin-top: 22px; font-size: 26px; line-height: 1.4; max-width: 660px; font-weight: 400; color: #5A5449; }
  p b { color: #221E18; font-weight: 600; }

  /* the stack at bench scale, k = 0.42 of the icon's SLABS */
  .bench { position: absolute; right: 96px; top: 96px; width: 300px; height: 330px; }
  .pool { position: absolute; left: 20px; top: 236px; width: 250px; height: 36px; border-radius: 50%;
           background: radial-gradient(closest-side, rgba(62,42,24,.30), rgba(62,42,24,.08) 65%, rgba(62,42,24,0)); }
  .slab { position: absolute; height: 44px; border-radius: 9px;
           background: linear-gradient(135deg, #645D4F 0%, #5A5449 34%, #332E27 78%, #221E18 100%);
           box-shadow: 11px -8px 0 #4C463B, 6px 10px 12px rgba(62,42,24,.28); }
  .s1 { left: 3px;  top: 0px;   width: 222px; }
  .s2 { left: 16px; top: 63px;  width: 226px; }
  .s3 { left: 0px;  top: 126px; width: 212px; }
  .s4 { left: 20px; top: 189px; width: 214px; }
  .cord { position: absolute; left: 0; top: -30px; width: 300px; height: 300px; }
</style>

       One scene at a time from a pack the drafter cannot widen, a gate that fails a paragraph
       sharing nothing with the one before it, and a fresh reader who checks nobody made up too early.</p>
