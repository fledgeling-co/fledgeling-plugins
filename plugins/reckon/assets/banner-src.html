<title>reckon banner</title>

<!--
  Derived from assets/build_icon.py. Every ratio below is that file's own
  constants at k = 0.36, and every colour is one of its named values:

    ROD_W 100 : ROD_H 400 : GAP 54 : ROD_R 50    the row and its rhythm
    COUNT 5, HOLLOW_INDEX 3                      four solid, one edges-only,
                                                 off-centre on purpose
    GROUND_TOP/BOT, VIGNETTE                     the family's warm porcelain
    ROD_LIT/SHADE/DEEP, ROD_TOP                  the top-lit graphite ramp
    ACCENT_CORE/MID/EDGE                         the one ember
    WARM_SHADOW                                  contact ellipses, warm because
                                                 a blue shadow in a warm scene
                                                 is the tell

  The signature move is that the accent object CASTS NO SHADOW. The icon's own
  notes record what breaks it: give the hollow rod a contact ellipse and it
  becomes just another rod that happens to be orange, and the argument -- that
  an unmeasured thing has no evidence under it -- disappears. So at bench scale
  the four solid rods keep their ellipses and the fourth has none. Its interior
  stays porcelain for the same reason: an ember wash inside reads as a rod lit
  from within, which is the opposite of not knowing what is in it.

  Wordmark is Familjen Grotesk, matching warrant -- the skill on the other side
  of the same question. warrant decides whether evidence is good enough to grant
  a tier; this one counts what has no evidence at all. Its tight apertures hold
  a six-character name at display size without looking spindly.

  Artwork is the real icon.png downscaled to 2x its display size and inlined as
  a data URI, because a file:// page here does not fetch file:// subresources
  and fails silently when it tries.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(138,122,98,0) 58%, rgba(138,122,98,.24) 100%),
      linear-gradient(163deg, #F8F5EE 0%, #E4DDCB 100%);
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    display: flex; align-items: center; gap: 60px;
    padding: 0 96px; overflow: hidden; position: relative;
  }

  .icon { width: 272px; height: 272px; flex: none; }

  h1 { font-size: 92px; font-weight: 700; letter-spacing: -.032em; line-height: 1;
       color: #221E18; }                                  /* ROD_DEEP */
  /* the one warm mark in the type, on the letter that sits where the icon puts
     its hollow: fourth of five. ACCENT_EDGE. */
  h1 i { font-style: normal; color: #DD6413; }

  p { margin-top: 24px; font-size: 26px; line-height: 1.42; max-width: 592px;
      font-weight: 400; color: #5A5449; }                 /* ROD_LIT */
  p b { color: #221E18; font-weight: 500; }

  /* ---- the row, at bench scale ------------------------------------------
     k = 0.36. Container 430x210, hung at the right. */
  .bench { position: absolute; right: 74px; top: 155px; width: 430px; height: 210px; }
  .rod { position: absolute; bottom: 26px; width: 36px; height: 144px;
         border-radius: 18px; }
  /* top-lit ramp, left face lit, right face falling away */
  .solid { background: linear-gradient(96deg, #6B6456 0%, #5A5449 30%, #332E27 72%, #221E18 100%); }
  /* the cap, catching the key */
  .solid::before { content: ""; position: absolute; left: 1px; top: 4px;
    width: 34px; height: 13px; border-radius: 50%;
    background: linear-gradient(150deg, #8A8274, #6E675A); }
  /* rim light down the left arris */
  .solid::after { content: ""; position: absolute; left: 3px; top: 18px;
    width: 2px; height: 108px; border-radius: 1px; background: #FFFDF8; opacity: .26; }

  /* contact shadows: warm, offset to the lower right, one per solid rod.
     There is deliberately none under .hollow. */
  .shadow { position: absolute; bottom: 12px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(62,42,24,.42), rgba(62,42,24,.12) 62%, rgba(62,42,24,0));
    width: 74px; height: 26px; }

  /* the hollow rod: edges only, same footprint, same place in the count */
  /* border-image ignores border-radius and inset box-shadow is accepted and
     never painted by the capture engine, so the edge is a plain border, which
     both honours the radius and actually renders. Interior stays transparent:
     the porcelain showing through is the whole point. */
  .hollow { background: none; border: 5px solid #E8862B; }
  .hollow::before { content: ""; position: absolute; left: 2px; top: 5px;
    width: 32px; height: 12px; border-radius: 50%;
    border: 3px solid #F0A24B; }
  .ember { position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,182,97,0) 56%, rgba(255,182,97,.20) 74%, rgba(255,182,97,0) 100%); }
</style>
