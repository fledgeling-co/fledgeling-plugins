<!doctype html>
<meta charset="utf-8">
<title>changelog banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap">
<!--
  Derived from assets/build_icon.py and the shipping icon.png. Every colour is one of
  build_icon.py's named values:

    GROUND_TOP/BOT, VIGNETTE : the family's warm porcelain
    G_LIT, G_SHADE, G_DEEP   : the warm graphite ramp of the rail and beads
    CARD_HI/MID/LO, CARD_EDGE : the porcelain entry cards
    EMBER_DEEP/EMBER/EMBER_HI : the one ember, spent only on the open ring

  The bench at the right is one changelog entry at miniature scale: three columns,
  Task, Achieved and Remaining, the same split the page makes on a desktop screen.
  Only Remaining carries the ember ring, because that is where the icon's open ring
  points: the newest entry still has work to do.

  The wordmark is Atkinson Hyperlegible Next, the face the changelog page itself is
  set in, linked from Google Fonts so a render on another machine sets the same face.

  The artwork is the real icon.png downscaled to 2x its display size and inlined as a
  data URI, because a file:// page does not fetch file:// subresources.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 520px; }
  body {
    background:
      radial-gradient(96% 132% at 50% 46%, rgba(138,122,98,0) 58%, rgba(138,122,98,.24) 100%),
      linear-gradient(163deg, #F8F5EE 0%, #E4DDCB 100%);
    font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px;
    padding: 0 96px; overflow: hidden; position: relative;
  }
  .icon { width: 272px; height: 272px; flex: none; }
  .content { max-width: 600px; z-index: 2; }
  h1 { font-size: 88px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: #221E18; }
  p { margin-top: 22px; font-size: 25px; line-height: 1.42; font-weight: 400; color: #5A5449; }
  p b { color: #221E18; font-weight: 700; }

  .bench { position: absolute; right: 84px; top: 118px; width: 420px; height: 284px; }
  .shadow { position: absolute; left: 30px; right: 6px; bottom: 6px; height: 40px; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(62,42,24,.30), rgba(62,42,24,.08) 65%, rgba(62,42,24,0)); }
  .entry { position: absolute; left: 0; top: 0; width: 404px; height: 252px; border-radius: 18px; padding: 22px 20px;
           background: linear-gradient(160deg, #FFFDF8 0%, #F3EDE1 70%, #E2D9C7 100%);
           box-shadow: 0 4px 0 #CFC4AE, 0 18px 30px rgba(62,42,24,.14); }
  .title { height: 14px; width: 232px; border-radius: 7px; background: #332E27; opacity: .8; }
  .sub { margin-top: 10px; height: 9px; width: 300px; border-radius: 5px; background: #5A5449; opacity: .35; }
  .cols { margin-top: 22px; display: grid; grid-template-columns: .9fr 1.4fr 1fr; gap: 10px; }
  .col { height: 132px; border-radius: 12px; padding: 14px 12px; background: rgba(255,253,248,.7);
         border: 1px solid #DCD3C1; }
  .col .lab { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; letter-spacing: .07em;
              text-transform: uppercase; color: #5A5449; }
  .col .ln { margin-top: 12px; height: 7px; border-radius: 4px; background: #5A5449; opacity: .3; }
  .col .ln + .ln { margin-top: 9px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #8A8273, #332E27 82%); flex: none; }
  .ring { width: 15px; height: 15px; border-radius: 50%; border: 4px solid #DE5A28; flex: none;
          box-shadow: 0 0 10px rgba(255,182,97,.7); }
  .col.open { background: rgba(255,240,225,.75); border-color: #E9C9A8; }
  .col.open .lab { color: #BC3A14; }
</style>
