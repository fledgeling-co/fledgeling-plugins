<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Fledgeling">
  <title>Fledgeling</title>
  <defs>
    <!-- ground: a cushion, not a print — lifted at the top, vignetted into the corners -->
    <linearGradient id="ground" x1="0" y1="0" x2="0.12" y2="1">
      <stop offset="0" stop-color="#3B362D"/>
      <stop offset="0.55" stop-color="#2A2620"/>
      <stop offset="1" stop-color="#211E19"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="74%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </radialGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFF8EA" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFF8EA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFF8EA" stop-opacity="0.04"/>
    </linearGradient>

    <!-- glyph: poured cream gel, one soft top light. Each form lit on its own axis. -->
    <linearGradient id="gelStem" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="0.40" stop-color="#EFE7D8"/>
      <stop offset="1" stop-color="#D3C6AF"/>
    </linearGradient>
    <linearGradient id="gelLo" x1="0.25" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="0.38" stop-color="#EFE7D8"/>
      <stop offset="1" stop-color="#D3C6AF"/>
    </linearGradient>
    <linearGradient id="gelHi" x1="0.2" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="0.42" stop-color="#EFE7D8"/>
      <stop offset="1" stop-color="#D3C6AF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="emberCore" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#F8B978"/>
      <stop offset="0.52" stop-color="#C4622D"/>
      <stop offset="1" stop-color="#9C4A1E"/>
    </radialGradient>
    <radialGradient id="emberHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0.2" stop-color="#E8823A" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#C4622D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C4622D" stop-opacity="0"/>
    </radialGradient>

    <filter id="ao" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="cast" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="rimBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="spec" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>

    <path id="tileShape" d="M1024 512 C1024 579.4 1023.7 669.8 1023 714.2 C1022.4 758.6 1021.4 760 1020 778.3 C1018.7 796.6 1017.1 810.4 1015.1 824.2 C1013.1 837.9 1010.7 849.5 1008 860.7 C1005.3 871.8 1002.3 881.6 998.9 891 C995.5 900.3 991.7 908.8 987.6 916.7 C983.4 924.7 978.9 932 973.9 938.8 C968.9 945.6 963.6 951.9 957.7 957.7 C951.9 963.6 945.6 968.9 938.8 973.9 C932 978.9 924.7 983.4 916.7 987.6 C908.8 991.7 900.3 995.5 891 998.9 C881.6 1002.3 871.8 1005.3 860.7 1008 C849.5 1010.7 837.9 1013.1 824.2 1015.1 C810.4 1017.1 796.6 1018.7 778.3 1020 C760 1021.4 758.6 1022.4 714.2 1023 C669.8 1023.7 579.4 1024 512 1024 C444.6 1024 354.2 1023.7 309.8 1023 C265.4 1022.4 264 1021.4 245.7 1020 C227.4 1018.7 213.6 1017.1 199.8 1015.1 C186.1 1013.1 174.5 1010.7 163.3 1008 C152.2 1005.3 142.4 1002.3 133 998.9 C123.7 995.5 115.2 991.7 107.3 987.6 C99.3 983.4 92 978.9 85.2 973.9 C78.4 968.9 72.1 963.6 66.3 957.7 C60.4 951.9 55.1 945.6 50.1 938.8 C45.1 932 40.6 924.7 36.4 916.7 C32.3 908.8 28.5 900.3 25.1 891 C21.7 881.6 18.7 871.8 16 860.7 C13.3 849.5 10.9 837.9 8.9 824.2 C6.9 810.4 5.3 796.6 4 778.3 C2.6 760 1.6 758.6 1 714.2 C0.3 669.8 0 579.4 0 512 C0 444.6 0.3 354.2 1 309.8 C1.6 265.4 2.6 264 4 245.7 C5.3 227.4 6.9 213.6 8.9 199.8 C10.9 186.1 13.3 174.5 16 163.3 C18.7 152.2 21.7 142.4 25.1 133 C28.5 123.7 32.3 115.2 36.4 107.3 C40.6 99.3 45.1 92 50.1 85.2 C55.1 78.4 60.4 72.1 66.3 66.3 C72.1 60.4 78.4 55.1 85.2 50.1 C92 45.1 99.3 40.6 107.3 36.4 C115.2 32.3 123.7 28.5 133 25.1 C142.4 21.7 152.2 18.7 163.3 16 C174.5 13.3 186.1 10.9 199.8 8.9 C213.6 6.9 227.4 5.3 245.7 4 C264 2.6 265.4 1.6 309.8 1 C354.2 0.3 444.6 0 512 0 C579.4 0 669.8 0.3 714.2 1 C758.6 1.6 760 2.6 778.3 4 C796.6 5.3 810.4 6.9 824.2 8.9 C837.9 10.9 849.5 13.3 860.7 16 C871.8 18.7 881.6 21.7 891 25.1 C900.3 28.5 908.8 32.3 916.7 36.4 C924.7 40.6 932 45.1 938.8 50.1 C945.6 55.1 951.9 60.4 957.7 66.3 C963.6 72.1 968.9 78.4 973.9 85.2 C978.9 92 983.4 99.3 987.6 107.3 C991.7 115.2 995.5 123.7 998.9 133 C1002.3 142.4 1005.3 152.2 1008 163.3 C1010.7 174.5 1013.1 186.1 1015.1 199.8 C1017.1 213.6 1018.7 227.4 1020 245.7 C1021.4 264 1022.4 265.4 1023 309.8 C1023.7 354.2 1024 444.6 1024 512 Z"/>
    <clipPath id="clipTile"><use href="#tileShape"/></clipPath>
    <clipPath id="clipStem"><path d="M455.5 817.1 C440.6 681.4 436.4 541.5 513.8 393.1 A18 18 0 0 1 545.6 405.8 C523.3 541.5 517 681.4 536 808.6 A44.5 44.5 0 0 1 455.5 817.1 Z"/></clipPath>
    <clipPath id="clipLo"><path d="M241.4 490.6 C353.7 477.9 461.8 524.6 508.5 605.1 C500 643.3 487.3 668.7 472.4 679.3 C379.2 700.5 292.2 643.3 241.4 490.6 Z"/></clipPath>
    <clipPath id="clipHi"><path d="M487.3 522.4 C517 431.3 606 355 743.8 355 C716.2 444 633.6 501.2 542.4 528.8 C517 537.3 497.9 535.2 487.3 522.4 Z"/></clipPath>
    <clipPath id="clipEmber"><circle cx="754.4" cy="234.1" r="57.2"/></clipPath>
  </defs>

  <!-- ===== bg — the cushion tile ===== -->
  <g id="bg">
    <use href="#tileShape" fill="url(#ground)"/>
    <use href="#tileShape" fill="url(#vignette)"/>
    <g clip-path="url(#clipTile)">
      <use href="#tileShape" fill="none" stroke="url(#tileRim)" stroke-width="7"/>
    </g>
  </g>

  <!-- ===== mid — the object's shadow on the tile + ember halo (both droppable) ===== -->
  <g id="mid">
    <g filter="url(#ao)" fill="#0F0C08" fill-opacity="0.38" transform="translate(0 14)">
      <path d="M455.5 817.1 C440.6 681.4 436.4 541.5 513.8 393.1 A18 18 0 0 1 545.6 405.8 C523.3 541.5 517 681.4 536 808.6 A44.5 44.5 0 0 1 455.5 817.1 Z"/><path d="M241.4 490.6 C353.7 477.9 461.8 524.6 508.5 605.1 C500 643.3 487.3 668.7 472.4 679.3 C379.2 700.5 292.2 643.3 241.4 490.6 Z"/><path d="M487.3 522.4 C517 431.3 606 355 743.8 355 C716.2 444 633.6 501.2 542.4 528.8 C517 537.3 497.9 535.2 487.3 522.4 Z"/>
    </g>
    <circle cx="754.4" cy="234.1" r="120.2" fill="url(#emberHalo)"/>
  </g>

  <!-- ===== fg — one poured object: stalk, two leaves growing out of it, ember ===== -->
  <g id="fg">
    <path id="stem" d="M455.5 817.1 C440.6 681.4 436.4 541.5 513.8 393.1 A18 18 0 0 1 545.6 405.8 C523.3 541.5 517 681.4 536 808.6 A44.5 44.5 0 0 1 455.5 817.1 Z" fill="url(#gelStem)" fill-opacity="0.97"/>

    <!-- lower leaf casts onto the stalk, then sits on it -->
    <g clip-path="url(#clipStem)">
      <path d="M241.4 490.6 C353.7 477.9 461.8 524.6 508.5 605.1 C500 643.3 487.3 668.7 472.4 679.3 C379.2 700.5 292.2 643.3 241.4 490.6 Z" fill="#6B5230" fill-opacity="0.22" filter="url(#cast)" transform="translate(4 9)"/>
    </g>
    <path id="wing-lower" d="M241.4 490.6 C353.7 477.9 461.8 524.6 508.5 605.1 C500 643.3 487.3 668.7 472.4 679.3 C379.2 700.5 292.2 643.3 241.4 490.6 Z" fill="url(#gelLo)" fill-opacity="0.97"/>

    <!-- upper leaf: the most translucent form — the stalk telegraphs faintly through it -->
    <g clip-path="url(#clipStem)">
      <path d="M487.3 522.4 C517 431.3 606 355 743.8 355 C716.2 444 633.6 501.2 542.4 528.8 C517 537.3 497.9 535.2 487.3 522.4 Z" fill="#6B5230" fill-opacity="0.20" filter="url(#cast)" transform="translate(4 8)"/>
    </g>
    <path id="wing-upper" d="M487.3 522.4 C517 431.3 606 355 743.8 355 C716.2 444 633.6 501.2 542.4 528.8 C517 537.3 497.9 535.2 487.3 522.4 Z" fill="url(#gelHi)" fill-opacity="0.95"/>

    <circle id="ember" cx="754.4" cy="234.1" r="57.2" fill="url(#emberCore)"/>
  </g>

  <!-- ===== highlight — rim light on the lit edges only, ember bloom ===== -->
  <g id="highlight">
    <g clip-path="url(#clipStem)">
      <path d="M455.5 817.1 C440.6 681.4 436.4 541.5 513.8 393.1 A18 18 0 0 1 545.6 405.8" fill="none" stroke="url(#rim)" stroke-width="9" filter="url(#rimBlur)"/>
    </g>
    <g clip-path="url(#clipLo)">
      <path d="M241.4 490.6 C353.7 477.9 461.8 524.6 508.5 605.1" fill="none" stroke="url(#rim)" stroke-width="9" filter="url(#rimBlur)"/>
    </g>
    <g clip-path="url(#clipHi)">
      <path d="M487.3 522.4 C517 431.3 606 355 743.8 355" fill="none" stroke="url(#rim)" stroke-width="9" filter="url(#rimBlur)"/>
    </g>
    <g clip-path="url(#clipEmber)">
      <circle cx="754.4" cy="234.1" r="57.2" fill="none"
              stroke="#FFE8C6" stroke-opacity="0.6" stroke-width="8" filter="url(#rimBlur)"/>
    </g>
    <ellipse cx="738.4" cy="211.2" rx="18.3" ry="13.2"
             fill="#FFF0D6" fill-opacity="0.6" filter="url(#spec)"/>
  </g>
</svg>
